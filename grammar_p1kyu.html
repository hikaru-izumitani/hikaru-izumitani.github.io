<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eiken Grade Pre-1 - Build a Sentence Practice (30 Questions)</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --border-color: #cbd5e1;
            --success: #16a34a;
            --error: #dc2626;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 1.25rem;
            margin: 0;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .timer-box {
            font-size: 1.1rem;
            font-weight: bold;
            background: #f1f5f9;
            padding: 6px 14px;
            border-radius: 20px;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border-color);
            transition: all 0.3s;
        }

        .timer-box.warning {
            background: #fef2f2;
            color: var(--error);
            border-color: #fca5a5;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .instructions {
            font-size: 0.95rem;
            color: #64748b;
            margin-bottom: 15px;
        }

        .progress {
            font-size: 0.85rem;
            font-weight: bold;
            color: #64748b;
            margin-bottom: 15px;
        }

        .prompt-box {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .statement {
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 1.05rem;
        }

        .sentence-builder {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 64px;
            padding: 12px;
            background: #ffffff;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            align-items: center;
            margin-bottom: 15px;
        }

        .fixed-word {
            background: #e2e8f0;
            border: 1px solid #cbd5e1;
            color: #475569;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            user-select: none;
        }

        .blank-slot {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 60px;
            min-height: 40px;
            padding: 4px 8px;
            background: #f8fafc;
            border: 2px dashed #94a3b8;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .blank-slot.drag-over {
            background: #e0e7ff;
            border-color: var(--primary);
        }

        .word-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 54px;
            padding: 12px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            align-items: center;
        }

        .word-pool-label {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 5px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .word-chip {
            background: #ffffff;
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: grab;
            font-size: 0.95rem;
            user-select: none;
            touch-action: none;
            transition: all 0.2s ease;
        }

        .word-chip:active {
            cursor: grabbing;
        }

        .word-chip.dragging {
            opacity: 0.4;
        }

        .punctuation-mark {
            font-weight: bold;
            font-size: 1.1rem;
            margin-left: 4px;
            color: #334155;
            align-self: flex-end;
            padding-bottom: 8px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
        }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            font-size: 0.95rem;
            min-height: 24px;
        }

        .feedback.correct {
            color: var(--success);
        }

        .feedback.incorrect {
            color: var(--error);
        }

        .explanation-box {
            margin-top: 15px;
            padding: 15px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            color: #166534;
        }

        .review-label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            font-size: 0.9rem;
            font-weight: normal;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-row">
        <h1>Eiken Grade Pre-1 Practice</h1>
        <div class="timer-box" id="timerBox">
            ⏱️ <span id="timerText">30</span>s
        </div>
    </div>
    <div class="instructions">英検準1級レベル（高度な関係詞、仮定法・倒置の発展、無生物主語構文、分詞構文・独立分詞構文、強調構文、動名詞・不定詞の高度なイディオム等）の並び替え問題を解きましょう。</div>
    
    <div class="progress" id="progress">Question 1 of 30</div>
    
    <div class="prompt-box">
        <div class="statement" id="statementText">Loading...</div>
        
        <div class="sentence-builder" id="sentenceBuilder"></div>
        
        <div class="word-pool-label">Word Bank (Drag / Tap & Drop)</div>
        <div class="word-pool" id="wordPool" ondragover="allowDrop(event)" ondragleave="removePoolStyle(event)" ondrop="dropToPool(event)"></div>
    </div>

    <div id="explanationContainer" class="explanation-box hidden">
        <div id="explanationText"></div>
        <label class="review-label">
            <input type="checkbox" id="reviewCheckbox" onchange="toggleReview()"> 正しい答えと文法解説を確認しました
        </label>
    </div>

    <div class="controls">
        <button id="checkBtn" onclick="checkAnswer()">Check Answer</button>
        <button id="nextBtn" onclick="nextQuestion()" style="display: none;" disabled>Next Question</button>
    </div>

    <div class="feedback" id="feedback"></div>
</div>

<script>
    const gradePre1Questions = [
        // 1. 無生物主語構文
        {
            context: "その道路工事のせいで、私は会社に遅れた。",
            parts: [
                { fixed: false, target: "The" },
                { fixed: false, target: "road" },
                { fixed: false, target: "construction" },
                { fixed: false, target: "prevented" },
                { fixed: false, target: "me" },
                { fixed: true, target: "from" },
                { fixed: true, target: "arriving" },
                { fixed: true, target: "at" },
                { fixed: true, target: "work" },
                { fixed: true, target: "on" },
                { fixed: true, target: "time" }
            ],
            punctuation: ".",
            explanation: "「prevent A from B」の形を取り、無生物主語（道路工事）が「〜のためAがBできなかった」という意味を表す準1級定番の構文です。"
        },
        // 2. 倒置（否定語の文頭移動）
        {
            context: "私はその会社で働くことになるとは夢にも思わなかった。",
            parts: [
                { fixed: false, target: "Little" },
                { fixed: false, target: "did" },
                { fixed: false, target: "I" },
                { fixed: false, target: "dream" },
                { fixed: false, target: "that" },
                { fixed: true, target: "I" },
                { fixed: true, target: "would" },
                { fixed: true, target: "work" },
                { fixed: true, target: "for" },
                { fixed: true, target: "the" },
                { fixed: true, target: "company" }
            ],
            punctuation: ".",
            explanation: "否定のニュアンスを持つ Little を文頭に置くことで、「Little + 助動詞 + 主語 + 動詞」の倒置が発生しています。"
        },
        // 3. 強調構文（主語の強調）
        {
            context: "私たちをその困難から救い出したのは、彼の冷静な判断だった。",
            parts: [
                { fixed: false, target: "It" },
                { fixed: false, target: "was" },
                { fixed: false, target: "his" },
                { fixed: false, target: "calm" },
                { fixed: false, target: "judgment" },
                { fixed: false, target: "that" },
                { fixed: true, target: "saved" },
                { fixed: true, target: "us" },
                { fixed: true, target: "from" },
                { fixed: true, target: "the" },
                { fixed: true, target: "difficulty" }
            ],
            punctuation: ".",
            explanation: "「It was 〜 that ...」の強調構文を使って、主語である his calm judgment を強く押し出しています。"
        },
        // 4. 関係代名詞の複合用法（the way 〜 = how の代用）
        {
            context: "彼がその問題を解決したやり方は、私たち全員を驚かせた。",
            parts: [
                { fixed: false, target: "The" },
                { fixed: false, target: "way" },
                { fixed: false, target: "in" },
                { fixed: false, target: "which" },
                { fixed: false, target: "he" },
                { fixed: false, target: "solved" },
                { fixed: true, target: "the" },
                { fixed: true, target: "problem" },
                { fixed: true, target: "surprised" },
                { fixed: true, target: "us" },
                { fixed: true, target: "all" }
            ],
            punctuation: ".",
            explanation: "「the way in which 〜」で「〜のやり方・方法」を表し、how と一緒に使えない点も準1級の重要ポイントです。"
        },
        // 5. 独立分詞構文（一般論の with 独立分詞）
        {
            context: "彼は腕組みをしたまま、その講演を聞いていた。",
            parts: [
                { fixed: false, target: "He" },
                { fixed: false, target: "listened" },
                { fixed: false, target: "to" },
                { fixed: false, target: "the" },
                { fixed: false, target: "lecture" },
                { fixed: false, target: "with" },
                { fixed: true, target: "his" },
                { fixed: true, target: "arms" },
                { fixed: true, target: "crossed" }
            ],
            punctuation: ".",
            explanation: "「with + 名詞 + 過去分詞」で「名詞が〜された状態で」という付帯状況を表す、頻出の独立分詞構文です。"
        },
        // 6. 仮定法現在（提案・要求の that 節）
        {
            context: "委員会は、その計画が即座に見直されることを強く勧めた。",
            parts: [
                { fixed: false, target: "The" },
                { fixed: false, target: "committee" },
                { fixed: false, target: "recommended" },
                { fixed: false, target: "that" },
                { fixed: false, target: "the" },
                { fixed: false, target: "plan" },
                { fixed: true, target: "be" },
                { fixed: true, target: "revised" },
                { fixed: true, target: "immediately" }
            ],
            punctuation: ".",
            explanation: "recommend などの要求・提案を表す動詞の後の that 節内では、should が省略されて「(should) be + 過去分詞」の原形受動態が使われます。"
        },
        // 7. 分離・譲歩の表現（no matter how）
        {
            context: "どれほど一生懸命働いても、彼女は満足しなかった。",
            parts: [
                { fixed: false, target: "No" },
                { fixed: false, target: "matter" },
                { fixed: false, target: "how" },
                { fixed: false, target: "hard" },
                { fixed: false, target: "she" },
                { fixed: false, target: "worked," },
                { fixed: true, target: "she" },
                { fixed: true, target: "was" },
                { fixed: true, target: "never" },
                { fixed: true, target: "satisfied" }
            ],
            punctuation: ".",
            explanation: "「No matter how + 形容詞/副詞 + 主語 + 動詞」の形で、「どれほど〜しても」という譲歩を表します。"
        },
        // 8. 無生物主語による原因の表現
        {
            context: "その予期せぬニュースによって、彼は一言も話せなくなった。",
            parts: [
                { fixed: false, target: "The" },
                { fixed: false, target: "unexpected" },
                { fixed: false, target: "news" },
                { fixed: false, target: "rendered" },
                { fixed: false, target: "him" },
                { fixed: true, target: "speechless" }
            ],
            punctuation: ".",
            explanation: "「render + O + C」で「OをCの状態にする」という、無生物主語と好んで使われる準1級レベルの高度な動詞構文です。"
        },
        // 9. 部分否定
        {
            context: "裕福な人が必ずしも幸せであるとは限らない。",
            parts: [
                { fixed: false, target: "A" },
                { fixed: false, target: "wealthy" },
                { fixed: false, target: "person" },
                { fixed: false, target: "is" },
                { fixed: false, target: "not" },
                { fixed: false, target: "necessarily" },
                { fixed: true, target: "happy" }
            ],
            punctuation: ".",
            explanation: "「not necessarily」で「必ずしも〜とは限らない」という部分否定を表す重要表現です。"
        },
        // 10. 全面否定（cannot 〜 too ...）
        {
            context: "健康のありがたさは、いくら強調してもしすぎることはない。",
            parts: [
                { fixed: false, target: "We" },
                { fixed: false, target: "cannot" },
                { fixed: false, target: "emphasize" },
                { fixed: false, target: "the" },
                { fixed: false, target: "importance" },
                { fixed: false, target: "of" },
                { fixed: true, target: "health" },
                { fixed: true, target: "too" },
                { fixed: true, target: "much" }
            ],
            punctuation: ".",
            explanation: "「cannot 〜 too ...」の形で「いくら〜してもしすぎることはない」という強い強調を表します。"
        },
        // 11. 関係代名詞の継続用法（前置詞 + which）
        {
            context: "彼は新しいプロジェクトを提案したが、それは大成功だった。",
            parts: [
                { fixed: false, target: "He" },
                { fixed: false, target: "proposed" },
                { fixed: false, target: "a" },
                { fixed: false, target: "new" },
                { fixed: false, target: "project," },
                { fixed: false, target: "in" },
                { fixed: true, target: "which" },
                { fixed: true, target: "he" },
                { fixed: true, target: "succeeded" },
                { fixed: true, target: "brilliantly" }
            ],
            punctuation: ".",
            explanation: "コンマに続く「in which」で、先行詞（新プロジェクト）の中での成功を描写する関係代名詞の継続用法です。"
        },
        // 12. 動名詞の慣用表現（It is no use 〜）
        {
            context: "今さら後悔しても始まらない。",
            parts: [
                { fixed: false, target: "It" },
                { fixed: false, target: "is" },
                { fixed: false, target: "of" },
                { fixed: false, target: "no" },
                { fixed: false, target: "use" },
                { fixed: false, target: "regretting" },
                { fixed: true, target: "it" },
                { fixed: true, target: "now" }
            ],
            punctuation: ".",
            explanation: "「It is of no use 〜ing」または「It is no use 〜ing」で「〜しても無駄だ」を表します。"
        },
        // 13. 比較の発展構文（the 比較級 〜, the 比較級 ...）
        {
            context: "本を読めば読むほど、より多くの知識が得られる。",
            parts: [
                { fixed: false, target: "The" },
                { fixed: false, target: "more" },
                { fixed: false, target: "you" },
                { fixed: false, target: "read" },
                { fixed: false, target: "books," },
                { fixed: false, target: "the" },
                { fixed: true, target: "more" },
                { fixed: true, target: "knowledge" },
                { fixed: true, target: "you" },
                { fixed: true, target: "gain" }
            ],
            punctuation: ".",
            explanation: "「The 比較級 〜, the 比較級 ...」で「〜すればするほど、ますます…」という比例を表す重要構文です。"
        },
        // 14. 譲歩を表す倒置（Asの省略的構文 / 形容詞 as 主語 動詞）
        {
            context: "たとえ彼が若くても、その責任を果たすことができる。",
            parts: [
                { fixed: false, target: "Young" },
                { fixed: false, target: "as" },
                { fixed: false, target: "he" },
                { fixed: false, target: "is," },
                { fixed: false, target: "he" },
                { fixed: true, target: "can" },
                { fixed: true, target: "fulfill" },
                { fixed: true, target: "the" },
                { fixed: true, target: "responsibility" }
            ],
            punctuation: ".",
            explanation: "「形容詞/副詞 as 主語 + 動詞」の語順で、「〜だが（譲歩）」という意味を示す高度な倒置構文です。"
        },
        // 15. 分離不定詞（too 〜 to ... の応用）
        {
            context: "その問題は非常に難しかったので、誰も解くことができなかった。",
            parts: [
                { fixed: false, target: "The" },
                { fixed: false, target: "problem" },
                { fixed: false, target: "was" },
                { fixed: false, target: "too" },
                { fixed: false, target: "difficult" },
                { fixed: false, target: "for" },
                { fixed: true, target: "anyone" },
                { fixed: true, target: "to" },
                { fixed: true, target: "solve" }
            ],
            punctuation: ".",
            explanation: "「too 〜 for A to ...」の形で「Aにはあまりに〜なので…できない」という結果を表す定番の構文です。"
        },
        // 16. 強調構文（時の副詞句の強調）
        {
            context: "彼がその真実に気づいたのは、事故の後だった。",
            parts: [
                { fixed: false, target: "It" },
                { fixed: false, target: "was" },
                { fixed: false, target: "not" },
                { fixed: false, target: "until" },
                { fixed: false, target: "after" },
                { fixed: false, target: "the" },
                { fixed: true, target: "accident" },
                { fixed: true, target: "that" },
                { fixed: true, target: "he" },
                { fixed: true, target: "realized" },
                { fixed: true, target: "the" },
                { fixed: true, target: "truth" }
            ],
            punctuation: ".",
            explanation: "「It was not until 〜 that ...」の形で、「〜して初めて…した」という強い強調を表します。"
        },
        // 17. 仮定法過去の応用（without 〜 / but for 〜）
        {
            context: "あなたの助けがなければ、私はその試験に落ちていただろう。",
            parts: [
                { fixed: false, target: "But" },
                { fixed: false, target: "for" },
                { fixed: false, target: "your" },
                { fixed: false, target: "help," },
                { fixed: false, target: "I" },
                { fixed: false, target: "would" },
                { fixed: true, target: "have" },
                { fixed: true, target: "failed" },
                { fixed: true, target: "the" },
                { fixed: true, target: "exam" }
            ],
            punctuation: ".",
            explanation: "「But for 〜」や「Without 〜」は「もし〜がなければ」という仮定法を導く重要な前置詞句です。"
        },
        // 18. 分詞構文（完了分詞構文）
        {
            context: "以前にその映画を見たことがあったので、彼女は結末を知っていた。",
            parts: [
                { fixed: false, target: "Having" },
                { fixed: false, target: "seen" },
                { fixed: false, target: "the" },
                { fixed: false, target: "movie" },
                { fixed: false, target: "before," },
                { fixed: true, target: "she" },
                { fixed: true, target: "knew" },
                { fixed: true, target: "the" },
                { fixed: true, target: "ending" }
            ],
            punctuation: ".",
            explanation: "主節の動詞よりも前の時点の出来事を表すために、分詞構文の先頭に「Having 過去分詞」を用いた完了分詞構文です。"
        },
        // 19. 頻出の慣用表現（as is often the case with 〜）
        {
            context: "若い人にはよくあることだが、彼は健康を過信していた。",
            parts: [
                { fixed: false, target: "As" },
                { fixed: false, target: "is" },
                { fixed: false, target: "often" },
                { fixed: false, target: "the" },
                { fixed: false, target: "case" },
                { fixed: false, target: "with" },
                { fixed: true, target: "young" },
                { fixed: true, target: "people," },
                { fixed: true, target: "he" },
                { fixed: true, target: "was" },
                { fixed: true, target: "overconfident" }
            ],
            punctuation: ".",
            explanation: "「As is often the case with 〜」で「〜にはよくあることだが」という意味を表す、英作文や読解の頻出表現です。"
        },
        // 20. 名詞節を導く Wh-ever
        {
            context: "彼女が言うことはどんなことでも、信用してはならない。",
            parts: [
                { fixed: false, target: "Whatever" },
                { fixed: false, target: "she" },
                { fixed: false, target: "might" },
                { fixed: false, target: "say," },
                { fixed: false, target: "you" },
                { fixed: true, target: "should" },
                { fixed: true, target: "not" },
                { fixed: true, target: "believe" },
                { fixed: true, target: "it" }
            ],
            punctuation: ".",
            explanation: "「Whatever 〜 might say」で「たとえ彼女が何と言おうとも（譲歩）」を表す複合関係代名詞の用法です。"
        },
        // 21. 受動態のイディオム（be supposed to 〜）
        {
            context: "私たちは会議を午後2時に始めることになっていた。",
            parts: [
                { fixed: false, target: "We" },
                { fixed: false, target: "were" },
                { fixed: false, target: "supposed" },
                { fixed: false, target: "to" },
                { fixed: false, target: "start" },
                { fixed: true, target: "the" },
                { fixed: true, target: "meeting" },
                { fixed: true, target: "at" },
                { fixed: true, target: "two" },
                { fixed: true, target: "o'clock" }
            ],
            punctuation: ".",
            explanation: "「be supposed to 〜」で「〜することになっている、〜するはずである」という義務や予定を表します。"
        },
        // 22. 無生物主語（enable O to do）
        {
            context: "その新しいテクノロジーによって、私たちはより速く通信できるようになった。",
            parts: [
                { fixed: false, target: "The" },
                { fixed: false, target: "new" },
                { fixed: false, target: "technology" },
                { fixed: false, target: "enabled" },
                { fixed: false, target: "us" },
                { fixed: true, target: "to" },
                { fixed: true, target: "communicate" },
                { fixed: true, target: "faster" }
            ],
            punctuation: ".",
            explanation: "「enable + O + to do」で「Oが〜することを可能にする」という典型的な無生物主語の表現です。"
        },
        // 23. 前置詞 + 関係代名詞（所有格 whose の言い換え等）
        {
            context: "窓がすべて開いている部屋は、とても涼しかった。",
            parts: [
                { fixed: false, target: "The" },
                { fixed: false, target: "room," },
                { fixed: false, target: "all" },
                { fixed: false, target: "the" },
                { fixed: false, target: "windows" },
                { fixed: false, target: "of" },
                { fixed: true, target: "which" },
                { fixed: true, target: "were" },
                { fixed: true, target: "open," },
                { fixed: true, target: "was" },
                { fixed: true, target: "very" },
                { fixed: true, target: "cool" }
            ],
            punctuation: ".",
            explanation: "「all the windows of which」の形で、whose windows の代わりに使用される、準1級レベルの高度な関係代名詞の継続用法です。"
        },
        // 24. 否定の副詞文頭による倒置（Seldom 〜）
        {
            context: "私たちはこれほど困難な状況に直面したことはめったにない。",
            parts: [
                { fixed: false, target: "Seldom" },
                { fixed: false, target: "have" },
                { fixed: false, target: "we" },
                { fixed: false, target: "encountered" },
                { fixed: false, target: "such" },
                { fixed: true, target: "a" },
                { fixed: true, target: "difficult" },
                { fixed: true, target: "situation" }
            ],
            punctuation: ".",
            explanation: "「めったに〜ない」を意味する Seldom を文頭に置くことで、助動詞 have と主語 we が倒置を起こしています。"
        },
        // 25. 分子構文の否定（Not having 〜）
        {
            context: "住所を知らなかったので、私は彼に手紙を書くことができなかった。",
            parts: [
                { fixed: false, target: "Not" },
                { fixed: false, target: "knowing" },
                { fixed: false, target: "his" },
                { fixed: false, target: "address," },
                { fixed: false, target: "I" },
                { fixed: true, target: "could" },
                { fixed: true, target: "not" },
                { fixed: true, target: "write" },
                { fixed: true, target: "to" },
                { fixed: true, target: "him" }
            ],
            punctuation: ".",
            explanation: "分詞構文を否定にする際、分詞（knowing）の直前に Not を置く「Not 〜ing」の形をとります。"
        },
        // 26. 「〜して間もなく…した」 (Scarcely 〜 when ...)
        {
            context: "私が家を出るか出ないかのうちに、雨が降り出した。",
            parts: [
                { fixed: false, target: "Scarcely" },
                { fixed: false, target: "had" },
                { fixed: false, target: "I" },
                { fixed: false, target: "left" },
                { fixed: false, target: "home" },
                { fixed: true, target: "when" },
                { fixed: true, target: "it" },
                { fixed: true, target: "began" },
                { fixed: true, target: "to" },
                { fixed: true, target: "rain" }
            ],
            punctuation: ".",
            explanation: "Hardly と同様に Scarcely を文頭に置いた倒置構文で、「〜するやいなや…」を表します。"
        },
        // 27. 動名詞の意味上の主語
        {
            context: "彼がその会議に遅れたことは、誰の目にも明らかだった。",
            parts: [
                { fixed: false, target: "His" },
                { fixed: false, target: "being" },
                { fixed: false, target: "late" },
                { fixed: false, target: "for" },
                { fixed: false, target: "the" },
                { fixed: true, target: "meeting" },
                { fixed: true, target: "was" },
                { fixed: true, target: "obvious" },
                { fixed: true, target: "to" },
                { fixed: true, target: "everyone" }
            ],
            punctuation: ".",
            explanation: "動名詞（being）の前に所有格（His）を置いて、動名詞の意味上の主語を明確にする高度な文法構造です。"
        },
        // 28. 形容詞の叙述用法（worth 〜ing）
        {
            context: "その本は時間をかけて読むだけの価値がある。",
            parts: [
                { fixed: false, target: "The" },
                { fixed: false, target: "book" },
                { fixed: false, target: "is" },
                { fixed: false, target: "well" },
                { fixed: false, target: "worth" },
                { fixed: true, target: "reading" },
                { fixed: true, target: "with" },
                { fixed: true, target: "care" }
            ],
            punctuation: ".",
            explanation: "「be worth 〜ing」で「〜する価値がある」を表し、well を挟んで強調することもよくあります。"
        },
        // 29. 仮定法過去（if を省略した倒置）
        {
            context: "もし私に翼があるなら、今すぐ君のもとに飛んでいけるのに。",
            parts: [
                { fixed: false, target: "Were" },
                { fixed: false, target: "I" },
                { fixed: false, target: "to" },
                { fixed: false, target: "have" },
                { fixed: false, target: "wings," },
                { fixed: false, target: "I" },
                { fixed: true, target: "could" },
                { fixed: true, target: "fly" },
                { fixed: true, target: "to" },
                { fixed: true, target: "you" }
            ],
            punctuation: ".",
            explanation: "「If I were to have」の if を省略し、Were を文頭に出した仮定法過去の倒置構文です。"
        },
        // 30. 強調構文の応用（疑問詞の強調）
        {
            context: "彼があなたにそんなことを言ったのは、いったい誰なのだろうか。",
            parts: [
                { fixed: false, target: "Who" },
                { fixed: false, target: "was" },
                { fixed: false, target: "it" },
                { fixed: false, target: "that" },
                { fixed: false, target: "said" },
                { fixed: true, target: "such" },
                { fixed: true, target: "a" },
                { fixed: true, target: "thing" },
                { fixed: true, target: "to" },
                { fixed: true, target: "you" }
            ],
            punctuation: "?",
            explanation: "疑問代名詞 Who を「It was 〜 that ...」で挟み込んだ、疑問詞の強調構文です（文末のピリオドに注意するため、疑問符に対応）。"
        }
    ];

    let questions = gradePre1Questions;
    let currentIdx = 0;
    let draggedChip = null;
    let timeLeft = 30;
    let timerInterval = null;
    let isAnswered = false;

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 30;
        isAnswered = false;
        updateTimerDisplay();

        const timerBox = document.getElementById('timerBox');
        timerBox.classList.remove('warning');

        timerInterval = setInterval(() => {
            if (isAnswered) return;
            timeLeft--;
            updateTimerDisplay();

            if (timeLeft <= 0) {
                if (!timerBox.classList.contains('warning')) {
                    timerBox.classList.add('warning');
                }
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const timerText = document.getElementById('timerText');
        timerText.innerText = timeLeft;
    }

    function loadQuestion() {
        const q = questions[currentIdx];
        document.getElementById('progress').innerText = `Question ${currentIdx + 1} of ${questions.length}`;
        document.getElementById('statementText').innerText = q.context;
        document.getElementById('feedback').innerText = '';
        document.getElementById('feedback').className = 'feedback';
        document.getElementById('checkBtn').style.display = 'inline-block';
        document.getElementById('nextBtn').style.display = 'none';
        
        document.getElementById('explanationContainer').classList.add('hidden');
        document.getElementById('reviewCheckbox').checked = false;

        const builder = document.getElementById('sentenceBuilder');
        const wordPool = document.getElementById('wordPool');
        builder.innerHTML = '';
        wordPool.innerHTML = '';

        let blankTargets = q.parts.filter(p => !p.fixed).map(p => p.target);
        let shuffledPool = [...blankTargets].sort(() => Math.random() - 0.5);

        shuffledPool.forEach(targetText => {
            wordPool.appendChild(createChip(targetText));
        });

        q.parts.forEach((part) => {
            if (part.fixed) {
                const fixedEl = document.createElement('div');
                fixedEl.className = 'fixed-word';
                fixedEl.innerText = part.target;
                builder.appendChild(fixedEl);
            } else {
                const slot = document.createElement('div');
                slot.className = 'blank-slot';
                slot.dataset.target = part.target;

                slot.addEventListener('dragover', (e) => {
                    if (isAnswered) return;
                    e.preventDefault();
                    slot.classList.add('drag-over');
                });
                slot.addEventListener('dragleave', () => {
                    slot.classList.remove('drag-over');
                });
                slot.addEventListener('drop', (e) => {
                    if (isAnswered) return;
                    e.preventDefault();
                    slot.classList.remove('drag-over');
                    if (draggedChip) {
                        if (slot.children.length > 0) {
                            wordPool.appendChild(slot.children[0]);
                        }
                        slot.appendChild(draggedChip);
                    }
                });

                builder.appendChild(slot);
            }
        });

        const punct = document.createElement('div');
        punct.className = 'punctuation-mark';
        punct.innerText = q.punctuation;
        builder.appendChild(punct);

        startTimer();
    }

    function createChip(text) {
        const chip = document.createElement('div');
        chip.className = 'word-chip';
        chip.draggable = true;
        chip.innerText = text;

        chip.addEventListener('dragstart', () => {
            if (isAnswered) return;
            draggedChip = chip;
            setTimeout(() => chip.classList.add('dragging'), 0);
        });
        chip.addEventListener('dragend', () => {
            draggedChip = null;
        });

        chip.addEventListener('touchstart', (e) => {
            if (isAnswered) return;
            draggedChip = chip;
            chip.classList.add('dragging');
        }, {passive: true});

        chip.addEventListener('touchend', (e) => {
            if (isAnswered) return;
            chip.classList.remove('dragging');
            
            const touch = e.changedTouches[0];
            const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);
            
            if (targetElement) {
                const slot = targetElement.closest('.blank-slot');
                const pool = targetElement.closest('.word-pool');
                
                if (slot) {
                    if (slot.children.length > 0) {
                        document.getElementById('wordPool').appendChild(slot.children[0]);
                    }
                    slot.appendChild(chip);
                } else if (pool) {
                    pool.appendChild(chip);
                }
            }
            draggedChip = null;
        });

        return chip;
    }

    function allowDrop(e) {
        if (isAnswered) return;
        e.preventDefault();
        e.currentTarget.style.background = '#f1f5f9';
    }

    function removePoolStyle(e) {
        e.currentTarget.style.background = '#f8fafc';
    }

    function dropToPool(e) {
        if (isAnswered) return;
        e.preventDefault();
        document.getElementById('wordPool').style.background = '#f8fafc';
        if (draggedChip) {
            document.getElementById('wordPool').appendChild(draggedChip);
        }
    }

    function checkAnswer() {
        if (isAnswered) return;
        
        const builder = document.getElementById('sentenceBuilder');
        const slots = builder.querySelectorAll('.blank-slot');
        const feedback = document.getElementById('feedback');

        let allFilled = true;
        let isCorrect = true;

        slots.forEach(slot => {
            if (slot.children.length === 0) {
                allFilled = false;
            } else {
                const userText = slot.children[0].innerText.trim();
                const correctText = slot.dataset.target.trim();
                if (userText.toLowerCase() !== correctText.toLowerCase()) {
                    isCorrect = false;
                }
            }
        });

        if (!allFilled) {
            feedback.innerText = "すべての空欄に単語を置いてください。";
            feedback.className = "feedback incorrect";
            return;
        }

        if (isCorrect) {
            isAnswered = true;
            clearInterval(timerInterval);
            feedback.innerText = "正解です！素晴らしい！";
            feedback.className = "feedback correct";
            document.getElementById('checkBtn').style.display = 'none';
            if (currentIdx < questions.length - 1) {
                document.getElementById('nextBtn').style.display = 'inline-block';
                document.getElementById('nextBtn').disabled = false;
            }
        } else {
            isAnswered = true;
            clearInterval(timerInterval);
            feedback.innerText = "不正解です。以下の正しい文と文法解説を確認してください。";
            feedback.className = "feedback incorrect";
            document.getElementById('checkBtn').style.display = 'none';
            
            const q = questions[currentIdx];
            let fullSentence = q.parts.map(p => p.target).join(" ") + q.punctuation;
            
            const explanationText = document.getElementById('explanationText');
            explanationText.innerHTML = `
                <strong>Correct Sentence:</strong> ${fullSentence}<br>
                <div style="margin-top: 8px; font-weight: normal; color: #166534; line-height: 1.5;">
                    <strong>文法解説:</strong> ${q.explanation}
                </div>
            `;
            document.getElementById('explanationContainer').classList.remove('hidden');
            
            if (currentIdx < questions.length - 1) {
                document.getElementById('nextBtn').style.display = 'inline-block';
                document.getElementById('nextBtn').disabled = true;
            }
        }
    }

    function toggleReview() {
        const checkbox = document.getElementById('reviewCheckbox');
        const nextBtn = document.getElementById('nextBtn');
        if (checkbox.checked) {
            nextBtn.disabled = false;
        } else {
            nextBtn.disabled = true;
        }
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
            loadQuestion();
        } else {
            document.getElementById('progress').innerText = "Complete!";
            document.getElementById('statementText').innerText = "おめでとうございます！英検準1級レベル全30問をすべてクリアしました！";
            document.getElementById('sentenceBuilder').innerHTML = "";
            document.getElementById('wordPool').innerHTML = "";
            document.getElementById('timerBox').style.display = "none";
            document.getElementById('checkBtn').style.display = "none";
            document.getElementById('nextBtn').style.display = "none";
            document.getElementById('explanationContainer').classList.add('hidden');
        }
    }

    loadQuestion();
</script>
