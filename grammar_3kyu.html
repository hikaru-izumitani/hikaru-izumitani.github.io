<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eiken Grade 3 - Build a Sentence Practice (30 Questions)</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --border-color: #cbd5e1;
            --success: #16a34a;
            --error: #dc2626;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 1.25rem;
            margin: 0;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .timer-box {
            font-size: 1.1rem;
            font-weight: bold;
            background: #f1f5f9;
            padding: 6px 14px;
            border-radius: 20px;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border-color);
            transition: all 0.3s;
        }

        .timer-box.warning {
            background: #fef2f2;
            color: var(--error);
            border-color: #fca5a5;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .instructions {
            font-size: 0.95rem;
            color: #64748b;
            margin-bottom: 15px;
        }

        .progress {
            font-size: 0.85rem;
            font-weight: bold;
            color: #64748b;
            margin-bottom: 15px;
        }

        .prompt-box {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .statement {
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 1.05rem;
        }

        .sentence-builder {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 64px;
            padding: 12px;
            background: #ffffff;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            align-items: center;
            margin-bottom: 15px;
        }

        .fixed-word {
            background: #e2e8f0;
            border: 1px solid #cbd5e1;
            color: #475569;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            user-select: none;
        }

        .blank-slot {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 60px;
            min-height: 40px;
            padding: 4px 8px;
            background: #f8fafc;
            border: 2px dashed #94a3b8;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .blank-slot.drag-over {
            background: #e0f2fe;
            border-color: var(--primary);
        }

        .word-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 54px;
            padding: 12px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            align-items: center;
        }

        .word-pool-label {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 5px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .word-chip {
            background: #ffffff;
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: grab;
            font-size: 0.95rem;
            user-select: none;
            touch-action: none;
            transition: all 0.2s ease;
        }

        .word-chip:active {
            cursor: grabbing;
        }

        .word-chip.dragging {
            opacity: 0.4;
        }

        .punctuation-mark {
            font-weight: bold;
            font-size: 1.1rem;
            margin-left: 4px;
            color: #334155;
            align-self: flex-end;
            padding-bottom: 8px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
        }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            font-size: 0.95rem;
            min-height: 24px;
        }

        .feedback.correct {
            color: var(--success);
        }

        .feedback.incorrect {
            color: var(--error);
        }

        .explanation-box {
            margin-top: 15px;
            padding: 15px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            color: #166534;
        }

        .review-label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            font-size: 0.9rem;
            font-weight: normal;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-row">
        <h1>Eiken Grade 3 Practice</h1>
        <div class="timer-box" id="timerBox">
            ⏱️ <span id="timerText">30</span>s
        </div>
    </div>
    <div class="instructions">英検3級レベル（現在完了形、受動態、不定詞・動名詞の応用、関係代名詞など）の並び替え問題を解きましょう。</div>
    
    <div class="progress" id="progress">Question 1 of 30</div>
    
    <div class="prompt-box">
        <div class="statement" id="statementText">Loading...</div>
        
        <div class="sentence-builder" id="sentenceBuilder"></div>
        
        <div class="word-pool-label">Word Bank (Drag / Tap & Drop)</div>
        <div class="word-pool" id="wordPool" ondragover="allowDrop(event)" ondragleave="removePoolStyle(event)" ondrop="dropToPool(event)"></div>
    </div>

    <!-- 解説・レビューエリア -->
    <div id="explanationContainer" class="explanation-box hidden">
        <div id="explanationText"></div>
        <label class="review-label">
            <input type="checkbox" id="reviewCheckbox" onchange="toggleReview()"> 正しい答えと文法解説を確認しました
        </label>
    </div>

    <div class="controls">
        <button id="checkBtn" onclick="checkAnswer()">Check Answer</button>
        <button id="nextBtn" onclick="nextQuestion()" style="display: none;" disabled>Next Question</button>
    </div>

    <div class="feedback" id="feedback"></div>
</div>

<script>
    const questions = [
        // 1. 現在完了形 (継続)
        {
            context: "私は3年間、ずっと京都に住んでいます。",
            parts: [
                { fixed: false, target: "I" },
                { fixed: false, target: "have" },
                { fixed: false, target: "lived" },
                { fixed: false, target: "in" },
                { fixed: false, target: "Kyoto" },
                { fixed: true, target: "for" },
                { fixed: true, target: "three" },
                { fixed: true, target: "years" }
            ],
            punctuation: ".",
            explanation: "「ずっと〜している」という継続は「have + 過去分詞」を使い、期間を表す for を伴います。"
        },
        // 2. 現在完了形 (経験)
        {
            context: "あなたは今までに外国に行ったことがありますか。",
            parts: [
                { fixed: false, target: "Have" },
                { fixed: false, target: "you" },
                { fixed: false, target: "ever" },
                { fixed: false, target: "been" },
                { fixed: true, target: "abroad" }
            ],
            punctuation: "?",
            explanation: "「今までに〜したことがありますか」と経験を尋ねる疑問文は「Have + 主語 + ever + 過去分詞〜?」の形にします。"
        },
        // 3. 現在完了形 (完了・結果)
        {
            context: "私はちょうど宿題を終えたところです。",
            parts: [
                { fixed: false, target: "I" },
                { fixed: false, target: "have" },
                { fixed: false, target: "just" },
                { fixed: false, target: "finished" },
                { fixed: true, target: "my" },
                { fixed: true, target: "homework" }
            ],
            punctuation: ".",
            explanation: "「ちょうど〜したところだ」という完了は just を have と過去分詞の間に挟みます。"
        },
        // 4. 受動態 (基本)
        {
            context: "この本は多くの人に読まれています。",
            parts: [
                { fixed: false, target: "This" },
                { fixed: false, target: "book" },
                { fixed: false, target: "is" },
                { fixed: false, target: "read" },
                { fixed: false, target: "by" },
                { fixed: true, target: "many" },
                { fixed: true, target: "people" }
            ],
            punctuation: ".",
            explanation: "受動態は「be動詞 + 過去分詞」で表し、動作主を「by 〜」で示します。"
        },
        // 5. 受動態 (過去)
        {
            context: "その窓は昨日、トムによって割られました。",
            parts: [
                { fixed: false, target: "The" },
                { fixed: false, target: "window" },
                { fixed: false, target: "was" },
                { fixed: false, target: "broken" },
                { fixed: false, target: "by" },
                { fixed: true, target: "Tom" },
                { fixed: true, target: "yesterday" }
            ],
            punctuation: ".",
            explanation: "過去の受動態は「was/were + 過去分詞（broken）」を使います。"
        },
        // 6. 不定詞 (感情の原因)
        -
        {
            context: "あなたにお会いできて嬉しいです。",
            parts: [
                { fixed: false, target: "I" },
                { fixed: false, target: "am" },
                { fixed: false, target: "glad" },
                { fixed: false, target: "to" },
                { fixed: false, target: "see" },
                { fixed: true, target: "you" }
            ],
            punctuation: ".",
            explanation: "感情を表す形容詞（glad）の後に「to + 動詞の原形」を置くことで、「〜して（感情だ）」という原因を表します。"
        },
        // 7. 不定詞 (it...to構文)
        {
            context: "英語を話すことは重要です。",
            parts: [
                { fixed: false, target: "It" },
                { fixed: false, target: "is" },
                { fixed: false, target: "important" },
                { fixed: false, target: "to" },
                { fixed: false, target: "speak" },
                { fixed: true, target: "English" }
            ],
            punctuation: ".",
            explanation: "長い主語を後ろに回し、形式主語の It を文頭に置く「It is + 形容詞 + to 〜」の構文です。"
        },
        // 8. 不定詞 (tell 人 to)
        {
            context: "母は私に部屋を掃除するように言いました。",
            parts: [
                { fixed: false, target: "My" },
                { fixed: false, target: "mother" },
                { fixed: false, target: "told" },
                { fixed: false, target: "me" },
                { fixed: false, target: "to" },
                { fixed: false, target: "clean" },
                { fixed: true, target: "my" },
                { fixed: true, target: "room" }
            ],
            punctuation: ".",
            explanation: "「人に〜するように言う」は「tell + 人 + to do」の形で表現します。"
        },
        // 9. 関係代名詞 (who - 主格)
        {
            context: "あのピアノを弾いている女の子は私の妹です。",
            parts: [
                { fixed: false, target: "The" },
                { fixed: false, target: "girl" },
                { fixed: false, target: "who" },
                { fixed: false, target: "is" },
                { fixed: false, target: "playing" },
                { fixed: false, target: "the" },
                { fixed: false, target: "piano" },
                { fixed: true, target: "is" },
                { fixed: true, target: "my" },
                { fixed: true, target: "sister" }
            ],
            punctuation: ".",
            explanation: "先行詞が人のとき、主格の関係代名詞 who を使って後ろから修飾します。"
        },
        // 10. 関係代名詞 (which - 主格)
        {
            context: "これは私が昨夜読んだ本です。",
            parts: [
                { fixed: false, target: "This" },
                { fixed: false, target: "is" },
                { fixed: false, target: "the" },
                { fixed: false, target: "book" },
                { fixed: false, target: "which" },
                { fixed: false, target: "I" },
                { fixed: false, target: "read" },
                { fixed: true, target: "last" },
                { fixed: true, target: "night" }
            ],
            punctuation: ".",
            explanation: "先行詞がモノのとき、関係代名詞 which（または that）を用いて修飾節を続けます。"
        },
        // 11. 関係代名詞 (that)
        {
            context: "私は大きな耳をしたウサギを知っています。",
            parts: [
                { fixed: false, target: "I" },
                { fixed: false, target: "know" },
                { fixed: false, target: "a" },
                { fixed: false, target: "rabbit" },
                { fixed: false, target: "that" },
                { fixed: false, target: "has" },
                { fixed: true, target: "big" },
                { fixed: true, target: "ears" }
            ],
            punctuation: ".",
            explanation: "関係代名詞 that は人・モノのどちらに対しても使うことができます。"
        },
        // 12. 間接疑問文
        {
            context: "彼がどこに住んでいるか知っていますか。",
            parts: [
                { fixed: false, target: "Do" },
                { fixed: false, target: "you" },
                { fixed: false, target: "know" },
                { fixed: false, target: "where" },
                { fixed: false, target: "he" },
                { fixed: true, target: "lives" }
            ],
            punctuation: "?",
            explanation: "疑問詞の後の語順が「主語（he）+ 動詞（lives）」になる間接疑問文の形です。"
        },
        // 13. 接頭辞・接続詞 (so ... that ...)
        {
            context: "彼はとても疲れていたので、早く寝ました。",
            parts: [
                { fixed: false, target: "He" },
                { fixed: false, target: "was" },
                { fixed: false, target: "so" },
                { fixed: false, target: "tired" },
                { fixed: false, target: "that" },
                { fixed: false, target: "he" },
                { fixed: false, target: "went" },
                { fixed: true, target: "to" },
                { fixed: true, target: "bed" },
                { fixed: true, target: "early" }
            ],
            punctuation: ".",
            explanation: "「とても〜なので…だ」という結果を表す「so + 形容詞 + that 節」の構文です。"
        },
        // 14. 分詞の形容詞的用法 (前置修飾)
        {
            context: "あそこに走っている少年が見えますか。",
            parts: [
                { fixed: false, target: "Can" },
                { fixed: false, target: "you" },
                { fixed: false, target: "see" },
                { fixed: false, target: "that" },
                { fixed: false, target: "running" },
                { fixed: true, target: "boy" },
                { fixed: true, target: "over" },
                { fixed: true, target: "there" }
            ],
            punctuation: "?",
            explanation: "1語の現在分詞（running）が名詞（boy）を前置して修飾しています。"
        },
        // 15. 分詞の形容詞的用法 (後置修飾)
        {
            context: "ベンチで本を読んでいる男性は私の父です。",
            parts: [
                { fixed: false, target: "The" },
                { fixed: false, target: "man" },
                { fixed: false, target: "reading" },
                { fixed: false, target: "a" },
                { fixed: false, target: "book" },
                { fixed: false, target: "on" },
                { fixed: false, target: "the" },
                { fixed: true, target: "bench" },
                { fixed: true, target: "is" },
                { fixed: true, target: "my" },
                { fixed: true, target: "father" }
            ],
            punctuation: ".",
            explanation: "分詞句が長くなる場合、名詞の後ろから修飾（後置修飾）します。"
        },
        // 16. 比較級の強調 (much)
        {
            context: "この車はあの車よりずっと大きいです。",
            parts: [
                { fixed: false, target: "This" },
                { fixed: false, target: "car" },
                { fixed: false, target: "is" },
                { fixed: false, target: "much" },
                { fixed: false, target: "bigger" },
                { fixed: false, target: "than" },
                { fixed: true, target: "that" },
                { fixed: true, target: "one" }
            ],
            punctuation: ".",
            explanation: "比較級（bigger）の前において「ずっと、はるかに」と強調するときは much を使います。"
        },
        // 17. 最上級 (+ of all)
        {
            context: "クジラはすべての動物の中で一番大きいです。",
            parts: [
                { fixed: false, target: "The" },
                { fixed: false, target: "whale" },
                { fixed: false, target: "is" },
                { fixed: false, target: "the" },
                { fixed: false, target: "largest" },
                { fixed: false, target: "of" },
                { fixed: true, target: "all" },
                { fixed: true, target: "animals" }
            ],
            punctuation: ".",
            explanation: "「すべての〜の中で」と範囲を指定して最上級を表すとき「of all + 複数名詞」を用います。"
        },
        // 18. 同等比較 (not as 〜 as)
        {
            context: "私の部屋は彼の部屋ほど広くありません。",
            parts: [
                { fixed: false, target: "My" },
                { fixed: false, target: "room" },
                { fixed: false, target: "is" },
                { fixed: false, target: "not" },
                { fixed: false, target: "as" },
                { fixed: false, target: "large" },
                { fixed: false, target: "as" },
                { fixed: true, target: "his" }
            ],
            punctuation: ".",
            explanation: "「〜ほど…ではない」という否定の同等比較は「not as (so) + 原級 + as」で表します。"
        },
        // 19. 接続詞 (while)
        {
            context: "私が夕食を作っている間、彼はテレビを見ていました。",
            parts: [
                { fixed: false, target: "While" },
                { fixed: false, target: "I" },
                { fixed: false, target: "was" },
                { fixed: false, target: "cooking" },
                { fixed: false, target: "dinner" },
                { fixed: true, target: "he" },
                { fixed: true, target: "was" },
                { fixed: true, target: "watching" },
                { fixed: true, target: "TV" }
            ],
            punctuation: ".",
            explanation: "「〜している間に」という意味を表す接続詞 While を使って、同時進行の動作を表します。"
        },
        // 20. 接続詞 (though / although)
        {
            context: "雨が降っていたけれども、私たちは出かけました。",
            parts: [
                { fixed: false, target: "Although" },
                { fixed: false, target: "it" },
                { fixed: false, target: "was" },
                { fixed: false, target: "raining" },
                { fixed: true, target: "we" },
                { fixed: true, target: "went" },
                { fixed: true, target: "out" }
            ],
            punctuation: ".",
            explanation: "「〜にもかかわらず、〜けれど」という譲歩を表す接続詞 Although を文頭に置いています。"
        },
        // 21. 名詞的用法 (動名詞の目的語)
        {
            context: "私は英語を勉強することを楽しみました。",
            parts: [
                { fixed: false, target: "I" },
                { fixed: false, target: "enjoyed" },
                { fixed: false, target: "studying" },
                { fixed: true, target: "English" }
            ],
            punctuation: ".",
            explanation: "動詞 enjoy は後ろに動名詞（studying）を目的語にとるルールがあります。"
        },
        // 22. 5文型 (SVOO)
        {
            context: "彼は私に英語を教えてくれます。",
            parts: [
                { fixed: false, target: "He" },
                { fixed: false, target: "teaches" },
                { fixed: false, target: "me" },
                { fixed: true, target: "English" }
            ],
            punctuation: ".",
            explanation: "teach などの授与動詞は「主語 + 動詞 + 人 + モノ（SVOO）」の語順をとります。"
        },
        // 23. 5文型 (SVOC)
        {
            context: "私たちは彼をリーダーに選びました。",
            parts: [
                { fixed: false, target: "We" },
                { fixed: false, target: "elected" },
                { fixed: false, target: "him" },
                { fixed: true, target: "leader" }
            ],
            punctuation: ".",
            explanation: "「彼をリーダーに」のように、目的語の性質や身分を補う「SVOC」の文型です。"
        },
        // 24. 付加疑問文
        {
            context: "彼はテニスをしますよね。",
            parts: [
                { fixed: false, target: "He" },
                { fixed: false, target: "plays" },
                { fixed: false, target: "tennis" },
                { fixed: true, target: "doesn't" },
                { fixed: true, target: "he" }
            ],
            punctuation: "?",
            explanation: "肯定文（plays）に対する付加疑問文は、否定の助動詞を用いた doesn't he を文末に添えます。"
        },
        // 25. 否定疑問文
        {
            context: "あなたはその映画を見ませんでしたか。",
            parts: [
                { fixed: false, target: "Didn't" },
                { fixed: false, target: "you" },
                { fixed: false, target: "see" },
                { fixed: true, target: "the" },
                { fixed: true, target: "movie" }
            ],
            punctuation: "?",
            explanation: "「〜しなかったのですか」と確認・驚きを表す否定疑問文は Didn't で始めます。"
        },
        // 26. 数量の表現 (a number of)
        {
            context: "公園にはたくさんの子どもたちがいました。",
            parts: [
                { fixed: false, target: "There" },
                { fixed: false, target: "were" },
                { fixed: false, target: "a" },
                { fixed: false, target: "number" },
                { fixed: false, target: "of" },
                { fixed: false, target: "children" },
                { fixed: true, target: "in" },
                { fixed: true, target: "the" },
                { fixed: true, target: "park" }
            ],
            punctuation: ".",
            explanation: "「たくさんの〜」を表す a number of の後ろには複数名詞が続きます。"
        },
        // 27. 代名詞 (one / another)
        {
            context: "私は1冊の本を持っています。もう1冊は家にあります。",
            parts: [
                { fixed: false, target: "One" },
                { fixed: false, target: "is" },
                { fixed: false, target: "here" },
                { fixed: true, target: "and" },
                { fixed: true, target: "another" },
                { fixed: true, target: "is" },
                { fixed: true, target: "at" },
                { fixed: true, target: "home" }
            ],
            punctuation: ".",
            explanation: "不特定の2つについて述べる際の「One 〜, another ...（1つは〜、もう1つは…）」の表現です。"
        },
        // 28. 使役動詞 (make 人 原形)
        {
            context: "そのニュースは私を悲しくさせました。",
            parts: [
                { fixed: false, target: "The" },
                { fixed: false, target: "news" },
                { fixed: false, target: "made" },
                { fixed: false, target: "me" },
                { fixed: true, target: "sad" }
            ],
            punctuation: ".",
            explanation: "使役動詞 make は「make + 目的語 + 形容詞/動詞の原形」の形で「〜を…の状態にする」を表します。"
        },
        // 29. 接続詞 (not only ... but also ...)
        {
            context: "彼は英語だけでなくフランス語も話します。",
            parts: [
                { fixed: false, target: "He" },
                { fixed: false, target: "speaks" },
                { fixed: false, target: "not" },
                { fixed: false, target: "only" },
                { fixed: false, target: "English" },
                { fixed: true, target: "but" },
                { fixed: true, target: "also" },
                { fixed: true, target: "French" }
            ],
            punctuation: ".",
            explanation: "「〜だけでなく…も」は「not only A but also B」のフレーズで表します。"
        },
        // 30. 間接疑問文 (what to do)
        {
            context: "私は何をすべきか分かっていません。",
            parts: [
                { fixed: false, target: "I" },
                { fixed: false, target: "don't" },
                { fixed: false, target: "know" },
                { fixed: false, target: "what" },
                { fixed: false, target: "to" },
                { fixed: true, target: "do" }
            ],
            punctuation: ".",
            explanation: "「疑問詞 + to不定詞」の形をとることで、「何を〜すべきか」という名詞句として機能させます。"
        }
    ];

    let currentIdx = 0;
    let draggedChip = null;
    let timeLeft = 30;
    let timerInterval = null;
    let isAnswered = false;

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 30;
        isAnswered = false;
        updateTimerDisplay();

        const timerBox = document.getElementById('timerBox');
        timerBox.classList.remove('warning');

        timerInterval = setInterval(() => {
            if (isAnswered) return;
            timeLeft--;
            updateTimerDisplay();

            if (timeLeft <= 0) {
                if (!timerBox.classList.contains('warning')) {
                    timerBox.classList.add('warning');
                }
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const timerText = document.getElementById('timerText');
        timerText.innerText = timeLeft;
    }

    function loadQuestion() {
        const q = questions[currentIdx];
        document.getElementById('progress').innerText = `Question ${currentIdx + 1} of ${questions.length}`;
        document.getElementById('statementText').innerText = q.context;
        document.getElementById('feedback').innerText = '';
        document.getElementById('feedback').className = 'feedback';
        document.getElementById('checkBtn').style.display = 'inline-block';
        document.getElementById('nextBtn').style.display = 'none';
        
        document.getElementById('explanationContainer').classList.add('hidden');
        document.getElementById('reviewCheckbox').checked = false;

        const builder = document.getElementById('sentenceBuilder');
        const wordPool = document.getElementById('wordPool');
        builder.innerHTML = '';
        wordPool.innerHTML = '';

        let blankTargets = q.parts.filter(p => !p.fixed).map(p => p.target);
        let shuffledPool = [...blankTargets].sort(() => Math.random() - 0.5);

        shuffledPool.forEach(targetText => {
            wordPool.appendChild(createChip(targetText));
        });

        q.parts.forEach((part) => {
            if (part.fixed) {
                const fixedEl = document.createElement('div');
                fixedEl.className = 'fixed-word';
                fixedEl.innerText = part.target;
                builder.appendChild(fixedEl);
            } else {
                const slot = document.createElement('div');
                slot.className = 'blank-slot';
                slot.dataset.target = part.target;

                slot.addEventListener('dragover', (e) => {
                    if (isAnswered) return;
                    e.preventDefault();
                    slot.classList.add('drag-over');
                });
                slot.addEventListener('dragleave', () => {
                    slot.classList.remove('drag-over');
                });
                slot.addEventListener('drop', (e) => {
                    if (isAnswered) return;
                    e.preventDefault();
                    slot.classList.remove('drag-over');
                    if (draggedChip) {
                        if (slot.children.length > 0) {
                            wordPool.appendChild(slot.children[0]);
                        }
                        slot.appendChild(draggedChip);
                    }
                });

                builder.appendChild(slot);
            }
        });

        const punct = document.createElement('div');
        punct.className = 'punctuation-mark';
        punct.innerText = q.punctuation;
        builder.appendChild(punct);

        startTimer();
    }

    function createChip(text) {
        const chip = document.createElement('div');
        chip.className = 'word-chip';
        chip.draggable = true;
        chip.innerText = text;

        chip.addEventListener('dragstart', () => {
            if (isAnswered) return;
            draggedChip = chip;
            setTimeout(() => chip.classList.add('dragging'), 0);
        });
        chip.addEventListener('dragend', () => {
            draggedChip = null;
        });

        chip.addEventListener('touchstart', (e) => {
            if (isAnswered) return;
            draggedChip = chip;
            chip.classList.add('dragging');
        }, {passive: true});

        chip.addEventListener('touchend', (e) => {
            if (isAnswered) return;
            chip.classList.remove('dragging');
            
            const touch = e.changedTouches[0];
            const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);
            
            if (targetElement) {
                const slot = targetElement.closest('.blank-slot');
                const pool = targetElement.closest('.word-pool');
                
                if (slot) {
                    if (slot.children.length > 0) {
                        document.getElementById('wordPool').appendChild(slot.children[0]);
                    }
                    slot.appendChild(chip);
                } else if (pool) {
                    pool.appendChild(chip);
                }
            }
            draggedChip = null;
        });

        return chip;
    }

    function allowDrop(e) {
        if (isAnswered) return;
        e.preventDefault();
        e.currentTarget.style.background = '#f1f5f9';
    }

    function removePoolStyle(e) {
        e.currentTarget.style.background = '#f8fafc';
    }

    function dropToPool(e) {
        if (isAnswered) return;
        e.preventDefault();
        document.getElementById('wordPool').style.background = '#f8fafc';
        if (draggedChip) {
            document.getElementById('wordPool').appendChild(draggedChip);
        }
    }

    function checkAnswer() {
        if (isAnswered) return;
        
        const builder = document.getElementById('sentenceBuilder');
        const slots = builder.querySelectorAll('.blank-slot');
        const feedback = document.getElementById('feedback');

        let allFilled = true;
        let isCorrect = true;

        slots.forEach(slot => {
            if (slot.children.length === 0) {
                allFilled = false;
            } else {
                const userText = slot.children[0].innerText.trim();
                const correctText = slot.dataset.target.trim();
                if (userText.toLowerCase() !== correctText.toLowerCase()) {
                    isCorrect = false;
                }
            }
        });

        if (!allFilled) {
            feedback.innerText = "すべての空欄に単語を置いてください。";
            feedback.className = "feedback incorrect";
            return;
        }

        if (isCorrect) {
            isAnswered = true;
            clearInterval(timerInterval);
            feedback.innerText = "正解です！素晴らしい！";
            feedback.className = "feedback correct";
            document.getElementById('checkBtn').style.display = 'none';
            if (currentIdx < questions.length - 1) {
                document.getElementById('nextBtn').style.display = 'inline-block';
                document.getElementById('nextBtn').disabled = false;
            }
        } else {
            isAnswered = true;
            clearInterval(timerInterval);
            feedback.innerText = "不正解です。以下の正しい文と文法解説を確認してください。";
            feedback.className = "feedback incorrect";
            document.getElementById('checkBtn').style.display = 'none';
            
            const q = questions[currentIdx];
            let fullSentence = q.parts.map(p => p.target).join(" ") + q.punctuation;
            
            const explanationText = document.getElementById('explanationText');
            explanationText.innerHTML = `
                <strong>Correct Sentence:</strong> ${fullSentence}<br>
                <div style="margin-top: 8px; font-weight: normal; color: #166534; line-height: 1.5;">
                    <strong>文法解説:</strong> ${q.explanation}
                </div>
            `;
            document.getElementById('explanationContainer').classList.remove('hidden');
            
            if (currentIdx < questions.length - 1) {
                document.getElementById('nextBtn').style.display = 'inline-block';
                document.getElementById('nextBtn').disabled = true;
            }
        }
    }

    function toggleReview() {
        const checkbox = document.getElementById('reviewCheckbox');
        const nextBtn = document.getElementById('nextBtn');
        if (checkbox.checked) {
            nextBtn.disabled = false;
        } else {
            nextBtn.disabled = true;
        }
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
            loadQuestion();
        } else {
            document.getElementById('progress').innerText = "Complete!";
            document.getElementById('statementText').innerText = "おめでとうございます！英検3級レベル全30問をすべてクリアしました！";
            document.getElementById('sentenceBuilder').innerHTML = "";
            document.getElementById('wordPool').innerHTML = "";
            document.getElementById('timerBox').style.display = "none";
            document.getElementById('checkBtn').style.display = "none";
            document.getElementById('nextBtn').style.display = "none";
            document.getElementById('explanationContainer').classList.add('hidden');
        }
    }

    loadQuestion();
</script>
