<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eiken Grade 4 - Build a Sentence Practice (30 Questions)</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --border-color: #cbd5e1;
            --success: #16a34a;
            --error: #dc2626;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 1.25rem;
            margin: 0;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .timer-box {
            font-size: 1.1rem;
            font-weight: bold;
            background: #f1f5f9;
            padding: 6px 14px;
            border-radius: 20px;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border-color);
            transition: all 0.3s;
        }

        .timer-box.warning {
            background: #fef2f2;
            color: var(--error);
            border-color: #fca5a5;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .instructions {
            font-size: 0.95rem;
            color: #64748b;
            margin-bottom: 15px;
        }

        .progress {
            font-size: 0.85rem;
            font-weight: bold;
            color: #64748b;
            margin-bottom: 15px;
        }

        .prompt-box {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .statement {
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 1.05rem;
        }

        .sentence-builder {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 64px;
            padding: 12px;
            background: #ffffff;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            align-items: center;
            margin-bottom: 15px;
        }

        .fixed-word {
            background: #e2e8f0;
            border: 1px solid #cbd5e1;
            color: #475569;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            user-select: none;
        }

        .blank-slot {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 60px;
            min-height: 40px;
            padding: 4px 8px;
            background: #f8fafc;
            border: 2px dashed #94a3b8;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .blank-slot.drag-over {
            background: #e0f2fe;
            border-color: var(--primary);
        }

        .word-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 54px;
            padding: 12px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            align-items: center;
        }

        .word-pool-label {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 5px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .word-chip {
            background: #ffffff;
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: grab;
            font-size: 0.95rem;
            user-select: none;
            touch-action: none;
            transition: all 0.2s ease;
        }

        .word-chip:active {
            cursor: grabbing;
        }

        .word-chip.dragging {
            opacity: 0.4;
        }

        .punctuation-mark {
            font-weight: bold;
            font-size: 1.1rem;
            margin-left: 4px;
            color: #334155;
            align-self: flex-end;
            padding-bottom: 8px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
        }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            font-size: 0.95rem;
            min-height: 24px;
        }

        .feedback.correct {
            color: var(--success);
        }

        .feedback.incorrect {
            color: var(--error);
        }

        .explanation-box {
            margin-top: 15px;
            padding: 15px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            color: #166534;
        }

        .review-label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            font-size: 0.9rem;
            font-weight: normal;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-row">
        <h1>Eiken Grade 4 Practice</h1>
        <div class="timer-box" id="timerBox">
            ⏱️ <span id="timerText">30</span>s
        </div>
    </div>
    <div class="instructions">英検4級レベルの並び替え問題を解きましょう（文末の固定パーツも正しく反映されています）。</div>
    
    <div class="progress" id="progress">Question 1 of 30</div>
    
    <div class="prompt-box">
        <div class="statement" id="statementText">Loading...</div>
        
        <div class="sentence-builder" id="sentenceBuilder"></div>
        
        <div class="word-pool-label">Word Bank (Drag / Tap & Drop)</div>
        <div class="word-pool" id="wordPool" ondragover="allowDrop(event)" ondragleave="removePoolStyle(event)" ondrop="dropToPool(event)"></div>
    </div>

    <!-- 解説・レビューエリア -->
    <div id="explanationContainer" class="explanation-box hidden">
        <div id="explanationText"></div>
        <label class="review-label">
            <input type="checkbox" id="reviewCheckbox" onchange="toggleReview()"> 正しい答えと文法解説を確認しました
        </label>
    </div>

    <div class="controls">
        <button id="checkBtn" onclick="checkAnswer()">Check Answer</button>
        <button id="nextBtn" onclick="nextQuestion()" style="display: none;" disabled>Next Question</button>
    </div>

    <div class="feedback" id="feedback"></div>
</div>

<script>
    const questions = [
        // 1 (画像問題21ベース)
        {
            context: "なぜあなたは今朝、そんなに早く起きたのですか。",
            parts: [
                { fixed: false, target: "Why" },
                { fixed: false, target: "did" },
                { fixed: false, target: "you" },
                { fixed: false, target: "get" },
                { fixed: false, target: "up" },
                { fixed: true, target: "so" },
                { fixed: true, target: "early" },
                { fixed: true, target: "this" },
                { fixed: true, target: "morning" }
            ],
            punctuation: "?",
            explanation: "過去の疑問詞の疑問文は「Why did ＋ 主語 ＋ 動詞の原形（get up）」の語順になり、文末に「so early this morning」が続きます。"
        },
        // 2 (画像問題22ベース)
        {
            context: "今日の午後、あなたに電話してもいいですか。",
            parts: [
                { fixed: false, target: "May" },
                { fixed: false, target: "I" },
                { fixed: false, target: "call" },
                { fixed: false, target: "you" },
                { fixed: true, target: "this" },
                { fixed: true, target: "afternoon" }
            ],
            punctuation: "?",
            explanation: "許可を求める表現「May I call you 〜?」の形を作ります。this afternoon が文末にきます。"
        },
        // 3 (画像問題23ベース)
        {
            context: "ネパールではたくさんの高い山を見ることができます。",
            parts: [
                { fixed: false, target: "You" },
                { fixed: false, target: "can" },
                { fixed: false, target: "see" },
                { fixed: false, target: "lots" },
                { fixed: false, target: "of" },
                { fixed: false, target: "high" },
                { fixed: false, target: "mountains" },
                { fixed: true, target: "in" },
                { fixed: true, target: "Nepal" }
            ],
            punctuation: ".",
            explanation: "助動詞 can のあとに see lots of high mountains を続け、文末に in Nepal を置きます。"
        },
        // 4 (画像問題24ベース)
        {
            context: "私は毎朝7時に家を出て学校へ向かいます。",
            parts: [
                { fixed: false, target: "I" },
                { fixed: false, target: "leave" },
                { fixed: false, target: "home" },
                { fixed: false, target: "at" },
                { fixed: false, target: "seven" },
                { fixed: true, target: "o'clock" },
                { fixed: true, target: "every" },
                { fixed: true, target: "morning" }
            ],
            punctuation: ".",
            explanation: "leave home at seven o'clock every morning で「毎朝7時に家を出る」となります。"
        },
        // 5 (画像問題25ベース)
        {
            context: "これらのコーヒーカップを洗ってくれますか。",
            parts: [
                { fixed: false, target: "Could" },
                { fixed: false, target: "you" },
                { fixed: false, target: "wash" },
                { fixed: false, target: "these" },
                { fixed: false, target: "coffee" },
                { fixed: false, target: "cups" },
                { fixed: true, target: "please" }
            ],
            punctuation: "?",
            explanation: "丁寧にお願いする「Could you wash these coffee cups, please?」の形を作ります。"
        },
        // 6. 過去形 (一般動詞)
        {
            context: "彼は昨日、サッカーをしました。",
            parts: [
                { fixed: false, target: "He" },
                { fixed: false, target: "played" },
                { fixed: false, target: "soccer" },
                { fixed: true, target: "yesterday" }
            ],
            punctuation: ".",
            explanation: "過去を表す副詞 yesterday があるため、一般動詞は過去形（played）にします。"
        },
        // 7. 過去の否定文
        {
            context: "私は昨夜テレビを見ませんでした。",
            parts: [
                { fixed: false, target: "I" },
                { fixed: false, target: "did" },
                { fixed: false, target: "not" },
                { fixed: false, target: "watch" },
                { fixed: false, target: "TV" },
                { fixed: true, target: "last" },
                { fixed: true, target: "night" }
            ],
            punctuation: ".",
            explanation: "過去の否定文は「did not（didn't）＋ 動詞の原形（watch）」の形を使います。"
        },
        // 8. 過去の疑問文
        {
            context: "あなたは昨日、図書館に行きましたか。",
            parts: [
                { fixed: false, target: "Did" },
                { fixed: false, target: "you" },
                { fixed: false, target: "go" },
                { fixed: false, target: "to" },
                { fixed: false, target: "the" },
                { fixed: false, target: "library" },
                { fixed: true, target: "yesterday" }
            ],
            punctuation: "?",
            explanation: "過去の疑問文は文頭に「Did」を置き、動詞は原形（go）に戻します。"
        },
        // 9. be動詞の過去形
        {
            context: "私たちは昨日、公園にいました。",
            parts: [
                { fixed: false, target: "We" },
                { fixed: false, target: "were" },
                { fixed: false, target: "in" },
                { fixed: false, target: "the" },
                { fixed: false, target: "park" },
                { fixed: true, target: "yesterday" }
            ],
            punctuation: ".",
            explanation: "主語が We の場合の過去形は「were」を使います。"
        },
        // 10. 未来 (will)
        {
            context: "明日は雨が降るでしょう。",
            parts: [
                { fixed: false, target: "It" },
                { fixed: false, target: "will" },
                { fixed: false, target: "rain" },
                { fixed: true, target: "tomorrow" }
            ],
            punctuation: ".",
            explanation: "未来を表す助動詞「will」のあとに、動詞の原形（rain）を置きます。"
        },
        // 11. 未来の疑問文 (will)
        {
            context: "あなたは明日、ここに来ますか。",
            parts: [
                { fixed: false, target: "Will" },
                { fixed: false, target: "you" },
                { fixed: false, target: "come" },
                { fixed: false, target: "here" },
                { fixed: true, target: "tomorrow" }
            ],
            punctuation: "?",
            explanation: "willを使った未来の疑問文は、文頭に「Will」を出して作ります。"
        },
        // 12. 不定詞 (名詞的用法 - こと)
        {
            context: "私は英語を話すことが好きです。",
            parts: [
                { fixed: false, target: "I" },
                { fixed: false, target: "like" },
                { fixed: false, target: "to" },
                { fixed: false, target: "speak" },
                { fixed: true, target: "English" }
            ],
            punctuation: ".",
            explanation: "「〜すること」を表す不定詞（to speak）を動詞 like の目的に置く表現です。"
        },
        // 13. 不定詞 (副詞的用法 - 〜するため)
        {
            context: "彼は本を読むために図書館に行きました。",
            parts: [
                { fixed: false, target: "He" },
                { fixed: false, target: "went" },
                { fixed: false, target: "to" },
                { fixed: false, target: "the" },
                { fixed: false, target: "library" },
                { fixed: false, target: "to" },
                { fixed: false, target: "read" },
                { fixed: true, target: "books" }
            ],
            punctuation: ".",
            explanation: "「〜するために」という目的を表す不定詞（to read books）を文末に置きます。"
        },
        // 14. 不定詞 (形容詞的用法 - 〜するための)
        {
            context: "私には読むべき本が何冊かあります。",
            parts: [
                { fixed: false, target: "I" },
                { fixed: false, target: "have" },
                { fixed: false, target: "some" },
                { fixed: false, target: "books" },
                { fixed: false, target: "to" },
                { fixed: true, target: "read" }
            ],
            punctuation: ".",
            explanation: "名詞（books）を後ろから修飾する不定詞（to read）の形容詞的用法です。"
        },
        // 15. 動名詞 (〜すること)
        {
            context: "テニスをすることは楽しいです。",
            parts: [
                { fixed: false, target: "Playing" },
                { fixed: false, target: "tennis" },
                { fixed: true, target: "is" },
                { fixed: true, target: "fun" }
            ],
            punctuation: ".",
            explanation: "文の主語の位置に動詞のing形（Playing tennis）を置いて「〜すること」を表します。"
        },
        // 16. 比較級 (〜よりもっと)
        {
            context: "この車はあの車より大きいです。",
            parts: [
                { fixed: false, target: "This" },
                { fixed: false, target: "car" },
                { fixed: false, target: "is" },
                { fixed: false, target: "bigger" },
                { fixed: false, target: "than" },
                { fixed: true, target: "that" },
                { fixed: true, target: "one" }
            ],
            punctuation: ".",
            explanation: "形容詞の比較級（bigger）に「〜よりも」を表す than を組み合わせます。"
        },
        // 17. 最上級 (一番〜)
        {
            context: "彼はクラスで一番背が高いです。",
            parts: [
                { fixed: false, target: "He" },
                { fixed: false, target: "is" },
                { fixed: false, target: "the" },
                { fixed: false, target: "tallest" },
                { fixed: true, target: "in" },
                { fixed: true, target: "his" },
                { fixed: true, target: "class" }
            ],
            punctuation: ".",
            explanation: "最上級には the をつけ、範囲を表すときは in や of を使います。"
        },
        // 18. 原級比較 (as 〜 as)
        {
            context: "メアリーはトムと同じくらい上手に歌います。",
            parts: [
                { fixed: false, target: "Mary" },
                { fixed: false, target: "sings" },
                { fixed: false, target: "as" },
                { fixed: false, target: "well" },
                { fixed: false, target: "as" },
                { fixed: true, target: "Tom" }
            ],
            punctuation: ".",
            explanation: "「〜と同じくらい…だ」という原級比較は「as ＋ 形容詞/副詞 ＋ as」の形にします。"
        },
        // 19. 接続詞 (because)
        {
            context: "私は疲れていたので、早く寝ました。",
            parts: [
                { fixed: false, target: "I" },
                { fixed: false, target: "went" },
                { fixed: false, target: "to" },
                { fixed: false, target: "bed" },
                { fixed: false, target: "early" },
                { fixed: false, target: "because" },
                { fixed: false, target: "I" },
                { fixed: false, target: "was" },
                { fixed: true, target: "tired" }
            ],
            punctuation: ".",
            explanation: "「なぜなら〜だから」という理由を表す接続詞 because で文をつなぎます。"
        },
        // 20. 接続詞 (when)
        {
            context: "私が家に着いたとき、母は料理をしていました。",
            parts: [
                { fixed: false, target: "When" },
                { fixed: false, target: "I" },
                { fixed: false, target: "got" },
                { fixed: false, target: "home" },
                { fixed: false, target: "my" },
                { fixed: false, target: "mother" },
                { fixed: false, target: "was" },
                { fixed: true, target: "cooking" }
            ],
            punctuation: ".",
            explanation: "「〜のとき」を表す接続詞 When を使って、過去の出来事と進行中の動作を表します。"
        },
        // 21. 接続詞 (if)
        {
            context: "もし明日晴れたら、私たちはテニスをします。",
            parts: [
                { fixed: false, target: "If" },
                { fixed: false, target: "it" },
                { fixed: false, target: "is" },
                { fixed: false, target: "fine" },
                { fixed: true, target: "tomorrow" },
                { fixed: true, target: "we" },
                { fixed: true, target: "will" },
                { fixed: true, target: "play" },
                { fixed: true, target: "tennis" }
            ],
            punctuation: ".",
            explanation: "条件を表す If 節の中では、未来のことでも現在形（is fine）を使うのがルールです。"
        },
        // 22. 助動詞 must (〜しなければならない)
        {
            context: "あなたはその宿題を今すぐしなければなりません。",
            parts: [
                { fixed: false, target: "You" },
                { fixed: false, target: "must" },
                { fixed: false, target: "do" },
                { fixed: false, target: "your" },
                { fixed: false, target: "homework" },
                { fixed: true, target: "now" }
            ],
            punctuation: ".",
            explanation: "義務を表す助動詞 must のあとに動詞の原形（do）を置きます。"
        },
        // 23. 助動詞 have to
        {
            context: "私は部屋を掃除しなくてはなりません。",
            parts: [
                { fixed: false, target: "I" },
                { fixed: false, target: "have" },
                { fixed: false, target: "to" },
                { fixed: false, target: "clean" },
                { fixed: false, target: "my" },
                { fixed: true, target: "room" }
            ],
            punctuation: ".",
            explanation: "「〜しなければならない」という客観的な必要性は「have to ＋ 動詞の原形」で表します。"
        },
        // 24. 助動詞 should (〜すべきだ)
        {
            context: "あなたはもっと早く寝るべきです。",
            parts: [
                { fixed: false, target: "You" },
                { fixed: false, target: "should" },
                { fixed: false, target: "go" },
                { fixed: false, target: "to" },
                { fixed: false, target: "bed" },
                { fixed: true, target: "earlier" }
            ],
            punctuation: ".",
            explanation: "アドバイスを表す助動詞 should のあとに動詞の原形（go）を続けます。"
        },
        // 25. 授与動詞 (give)
        {
            context: "彼は私にペンを1本くれました。",
            parts: [
                { fixed: false, target: "He" },
                { fixed: false, target: "gave" },
                { fixed: false, target: "me" },
                { fixed: false, target: "a" },
                { fixed: true, target: "pen" }
            ],
            punctuation: ".",
            explanation: "授与動詞 gave のあとに、人（me）、物（a pen）の順に並べます。"
        },
        // 26. 代名詞 (one)
        {
            context: "私はその赤いペンが欲しいです。",
            parts: [
                { fixed: false, target: "I" },
                { fixed: false, target: "want" },
                { fixed: false, target: "the" },
                { fixed: false, target: "red" },
                { fixed: false, target: "pen" },
                { fixed: true, target: "not" },
                { fixed: true, target: "the" },
                { fixed: true, target: "blue" },
                { fixed: true, target: "one" }
            ],
            punctuation: ".",
            explanation: "直前の名詞の繰り返しを避けるため、代名詞の「one」を使っています。"
        },
        // 27. 疑問詞 ＋ 不定詞 (what to do)
        {
            context: "私は何をすべきか分かりません。",
            parts: [
                { fixed: false, target: "I" },
                { fixed: false, target: "don't" },
                { fixed: false, target: "know" },
                { fixed: false, target: "what" },
                { fixed: false, target: "to" },
                { fixed: true, target: "do" }
            ],
            punctuation: ".",
            explanation: "「疑問詞 ＋ to ＋ 動詞の原形」で「何をすべきか」という名詞の塊を作ります。"
        },
        // 28. 感嘆文 (What a 〜!)
        {
            context: "なんて美しい花でしょう！",
            parts: [
                { fixed: false, target: "What" },
                { fixed: false, target: "a" },
                { fixed: false, target: "beautiful" },
                { fixed: false, target: "flower" },
                { fixed: true, target: "it" },
                { fixed: true, target: "is" }
            ],
            punctuation: "!",
            explanation: "名詞を強調する感嘆文は「What a ＋ 形容詞 ＋ 名詞 ＋ 主語 ＋ 動詞！」の語順になります。"
        },
        // 29. 間接疑問文の基本 (I know where)
        {
            context: "私は彼がどこに住んでいるか知っています。",
            parts: [
                { fixed: false, target: "I" },
                { fixed: false, target: "know" },
                { fixed: false, target: "where" },
                { fixed: false, target: "he" },
                { fixed: true, target: "lives" }
            ],
            punctuation: ".",
            explanation: "「疑問詞 ＋ 主語 ＋ 動詞」の語順（間接疑問文）が動詞 know の目的にきています。"
        },
        // 30. 受動態の基本 (be ＋ 過去分詞)
        {
            context: "この歌は世界中で歌われています。",
            parts: [
                { fixed: false, target: "This" },
                { fixed: false, target: "song" },
                { fixed: false, target: "is" },
                { fixed: false, target: "sung" },
                { fixed: true, target: "all" },
                { fixed: true, target: "over" },
                { fixed: true, target: "the" },
                { fixed: true, target: "world" }
            ],
            punctuation: ".",
            explanation: "「〜される」という受動態は「be動詞 ＋ 過去分詞（sung）」の形で表します。"
        }
    ];

    let currentIdx = 0;
    let draggedChip = null;
    let timeLeft = 30;
    let timerInterval = null;
    let isAnswered = false;

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 30;
        isAnswered = false;
        updateTimerDisplay();

        const timerBox = document.getElementById('timerBox');
        timerBox.classList.remove('warning');

        timerInterval = setInterval(() => {
            if (isAnswered) return;
            timeLeft--;
            updateTimerDisplay();

            if (timeLeft <= 0) {
                if (!timerBox.classList.contains('warning')) {
                    timerBox.classList.add('warning');
                }
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const timerText = document.getElementById('timerText');
        timerText.innerText = timeLeft;
    }

    function loadQuestion() {
        const q = questions[currentIdx];
        document.getElementById('progress').innerText = `Question ${currentIdx + 1} of ${questions.length}`;
        document.getElementById('statementText').innerText = q.context;
        document.getElementById('feedback').innerText = '';
        document.getElementById('feedback').className = 'feedback';
        document.getElementById('checkBtn').style.display = 'inline-block';
        document.getElementById('nextBtn').style.display = 'none';
        
        document.getElementById('explanationContainer').classList.add('hidden');
        document.getElementById('reviewCheckbox').checked = false;

        const builder = document.getElementById('sentenceBuilder');
        const wordPool = document.getElementById('wordPool');
        builder.innerHTML = '';
        wordPool.innerHTML = '';

        let blankTargets = q.parts.filter(p => !p.fixed).map(p => p.target);
        let shuffledPool = [...blankTargets].sort(() => Math.random() - 0.5);

        shuffledPool.forEach(targetText => {
            wordPool.appendChild(createChip(targetText));
        });

        q.parts.forEach((part) => {
            if (part.fixed) {
                const fixedEl = document.createElement('div');
                fixedEl.className = 'fixed-word';
                fixedEl.innerText = part.target;
                builder.appendChild(fixedEl);
            } else {
                const slot = document.createElement('div');
                slot.className = 'blank-slot';
                slot.dataset.target = part.target;

                slot.addEventListener('dragover', (e) => {
                    if (isAnswered) return;
                    e.preventDefault();
                    slot.classList.add('drag-over');
                });
                slot.addEventListener('dragleave', () => {
                    slot.classList.remove('drag-over');
                });
                slot.addEventListener('drop', (e) => {
                    if (isAnswered) return;
                    e.preventDefault();
                    slot.classList.remove('drag-over');
                    if (draggedChip) {
                        if (slot.children.length > 0) {
                            wordPool.appendChild(slot.children[0]);
                        }
                        slot.appendChild(draggedChip);
                    }
                });

                builder.appendChild(slot);
            }
        });

        const punct = document.createElement('div');
        punct.className = 'punctuation-mark';
        punct.innerText = q.punctuation;
        builder.appendChild(punct);

        startTimer();
    }

    function createChip(text) {
        const chip = document.createElement('div');
        chip.className = 'word-chip';
        chip.draggable = true;
        chip.innerText = text;

        chip.addEventListener('dragstart', () => {
            if (isAnswered) return;
            draggedChip = chip;
            setTimeout(() => chip.classList.add('dragging'), 0);
        });
        chip.addEventListener('dragend', () => {
            draggedChip = null;
        });

        chip.addEventListener('touchstart', (e) => {
            if (isAnswered) return;
            draggedChip = chip;
            chip.classList.add('dragging');
        }, {passive: true});

        chip.addEventListener('touchend', (e) => {
            if (isAnswered) return;
            chip.classList.remove('dragging');
            
            const touch = e.changedTouches[0];
            const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);
            
            if (targetElement) {
                const slot = targetElement.closest('.blank-slot');
                const pool = targetElement.closest('.word-pool');
                
                if (slot) {
                    if (slot.children.length > 0) {
                        document.getElementById('wordPool').appendChild(slot.children[0]);
                    }
                    slot.appendChild(chip);
                } else if (pool) {
                    pool.appendChild(chip);
                }
            }
            draggedChip = null;
        });

        return chip;
    }

    function allowDrop(e) {
        if (isAnswered) return;
        e.preventDefault();
        e.currentTarget.style.background = '#f1f5f9';
    }

    function removePoolStyle(e) {
        e.currentTarget.style.background = '#f8fafc';
    }

    function dropToPool(e) {
        if (isAnswered) return;
        e.preventDefault();
        document.getElementById('wordPool').style.background = '#f8fafc';
        if (draggedChip) {
            document.getElementById('wordPool').appendChild(draggedChip);
        }
    }

    function checkAnswer() {
        if (isAnswered) return;
        
        const builder = document.getElementById('sentenceBuilder');
        const slots = builder.querySelectorAll('.blank-slot');
        const feedback = document.getElementById('feedback');

        let allFilled = true;
        let isCorrect = true;

        slots.forEach(slot => {
            if (slot.children.length === 0) {
                allFilled = false;
            } else {
                const userText = slot.children[0].innerText.trim();
                const correctText = slot.dataset.target.trim();
                if (userText.toLowerCase() !== correctText.toLowerCase()) {
                    isCorrect = false;
                }
            }
        });

        if (!allFilled) {
            feedback.innerText = "すべての空欄に単語を置いてください。";
            feedback.className = "feedback incorrect";
            return;
        }

        if (isCorrect) {
            isAnswered = true;
            clearInterval(timerInterval);
            feedback.innerText = "正解です！素晴らしい！";
            feedback.className = "feedback correct";
            document.getElementById('checkBtn').style.display = 'none';
            if (currentIdx < questions.length - 1) {
                document.getElementById('nextBtn').style.display = 'inline-block';
                document.getElementById('nextBtn').disabled = false;
            }
        } else {
            isAnswered = true;
            clearInterval(timerInterval);
            feedback.innerText = "不正解です。以下の正しい文と文法解説を確認してください。";
            feedback.className = "feedback incorrect";
            document.getElementById('checkBtn').style.display = 'none';
            
            const q = questions[currentIdx];
            let fullSentence = q.parts.map(p => p.target).join(" ") + q.punctuation;
            
            const explanationText = document.getElementById('explanationText');
            explanationText.innerHTML = `
                <strong>Correct Sentence:</strong> ${fullSentence}<br>
                <div style="margin-top: 8px; font-weight: normal; color: #166534; line-height: 1.5;">
                    <strong>文法解説:</strong> ${q.explanation}
                </div>
            `;
            document.getElementById('explanationContainer').classList.remove('hidden');
            
            if (currentIdx < questions.length - 1) {
                document.getElementById('nextBtn').style.display = 'inline-block';
                document.getElementById('nextBtn').disabled = true;
            }
        }
    }

    function toggleReview() {
        const checkbox = document.getElementById('reviewCheckbox');
        const nextBtn = document.getElementById('nextBtn');
        if (checkbox.checked) {
            nextBtn.disabled = false;
        } else {
            nextBtn.disabled = true;
        }
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
            loadQuestion();
        } else {
            document.getElementById('progress').innerText = "Complete!";
            document.getElementById('statementText').innerText = "おめでとうございます！全30問をすべてクリアしました！";
            document.getElementById('sentenceBuilder').innerHTML = "";
            document.getElementById('wordPool').innerHTML = "";
            document.getElementById('timerBox').style.display = "none";
            document.getElementById('checkBtn').style.display = "none";
            document.getElementById('nextBtn').style.display = "none";
            document.getElementById('explanationContainer').classList.add('hidden');
        }
    }

    loadQuestion();
</script>

</body>
