<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BUILD A SENTENCE - TOEFL Practice (30 Questions)</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --danger-color: #ef4444;
            --success-color: #22c55e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 750px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 1.5rem;
            margin: 0;
            letter-spacing: 0.05em;
        }

        .timer-badge {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .timer-badge.negative {
            color: var(--danger-color);
            border-color: var(--danger-color);
        }

        .instructions {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 8px;
            line-height: 1.5;
        }

        .progress-text {
            font-weight: 600;
            color: var(--text-main);
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .prompt-text {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .drop-zone {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            min-height: 70px;
            padding: 16px;
            background-color: #ffffff;
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            margin-bottom: 24px;
        }

        .word-bank-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 0.05em;
            margin-bottom: 10px;
        }

        .word-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            min-height: 60px;
            padding: 12px;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }

        .chip {
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 500;
            box-shadow: 0 1px 2px rgba(0,0,0,0.02);
            transition: all 0.15s ease;
            user-select: none;
        }

        .chip:hover {
            border-color: var(--primary-color);
            background-color: #eff6ff;
        }

        .action-row {
            display: flex;
            gap: 12px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-primary:hover {
            background-color: #1d4ed8;
        }

        .btn-primary:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .explanation-box {
            display: none;
            margin-top: 20px;
            padding: 16px;
            background-color: #f8fafc;
            border-left: 4px solid var(--primary-color);
            border-radius: 4px;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .explanation-box.show {
            display: block;
        }

        .result-indicator {
            font-weight: 700;
            margin-bottom: 6px;
            font-size: 1.05rem;
        }
        .result-indicator.correct { color: var(--success-color); }
        .result-indicator.incorrect { color: var(--danger-color); }
    </style>
</head>
<body>

<div class="container">
    <div class="header-row">
        <h1>BUILD A SENTENCE</h1>
        <div id="timer" class="timer-badge">⏱ 40 s</div>
    </div>

    <div class="instructions">
        Move the words into the blanks to create grammatical sentences. If incorrect, review the correct answer and grammar note before proceeding.
    </div>
    <div class="progress-text" id="progress-text">Question 1 of 30</div>

    <div class="card">
        <div class="prompt-text" id="prompt-text">Loading...</div>
        
        <div class="drop-zone" id="drop-zone"></div>

        <div class="word-bank-title">WORD BANK (TAP TO MOVE)</div>
        <div class="word-bank" id="word-bank"></div>
    </div>

    <div class="action-row">
        <button class="btn-primary" id="submit-btn" onclick="checkAnswer()">Check Answer</button>
        <button class="btn-primary" id="next-btn" style="display:none; background-color: var(--success-color);" onclick="nextQuestion()">Next Question</button>
    </div>

    <div class="explanation-box" id="explanation-box">
        <div id="result-indicator" class="result-indicator"></div>
        <div id="explanation-content"></div>
    </div>
</div>

<script>
    const problems = [
        {
            prompt: "Did you manage to talk to the supervisor about the schedule change?",
            words: ["chance", "haven't", "yet", "to", "had", "I", "a"], // "a" を追加して7個に修正
            correctOrder: ["I", "haven't", "had", "a", "chance", "to", "yet"],
            punctuation: ".",
            explanation: "助動詞 `have` の後には過去分詞（`had`）が続き、不定詞 `to` の後には省略可能な目的語を挟んで文末に `yet` を配置します。"
        },
        {
            prompt: "Where did you get that necktie?",
            words: ["gift", "my", "from", "a", "was", "sister", "birthday", "for", "It"],
            correctOrder: ["It", "was", "a", "gift", "from", "my", "sister", "for", "my", "birthday"],
            punctuation: ".",
            explanation: "主語 `It` に続く動詞は `was`。所有格や前置詞（`from`, `for`）の結びつき（コロケーション）を正しく捉えて順序を組み立てます。"
        },
        {
            prompt: "How long have you been living at your current address?",
            words: ["about", "weeks", "into", "apartment", "three", "moved", "I", "this", "ago"],
            correctOrder: ["I", "moved", "into", "this", "apartment", "about", "three", "weeks", "ago"],
            punctuation: ".",
            explanation: "過去の時点から現在までの起点を表す場合は `before` ではなく `ago` を文末に用います。また `move into` の組み合わせが基本です。"
        },
        {
            prompt: "It looks like all of the seats have already been taken.",
            words: ["Auditorium", "to", "sooner", "gotten", "we", "should", "have", "Yeah,", "I", "guess"],
            correctOrder: ["Yeah,", "I", "guess", "we", "should", "have", "gotten", "to", "the", "auditorium", "sooner"],
            punctuation: ".",
            explanation: "助動詞の過去形 `should have` の後には過去分詞 `gotten` が来ます。また到達を表す際は `get in` ではなく `get to` を使用します。"
        },
        {
            prompt: "I'm not sure how to replace the ink cartridge for this printer.",
            words: ["send", "James", "call", "IT", "you", "should", "just", "and", "ask", "them", "to", "Then,"],
            correctOrder: ["Then,", "you", "should", "just", "call", "IT", "and", "ask", "them", "to", "send", "James"],
            punctuation: ".",
            explanation: "助動詞 `should` の直後に副詞 `just` を挿入し、目的語の後に続く不定詞（`to send`）の形を正しく配置します。"
        },
        {
            prompt: "Have you decided what you would like to order?",
            words: ["is", "huge", "minutes", "because", "a", "few", "more", "menu", "use", "this", "could", "we", "Actually,"],
            correctOrder: ["Actually,", "we", "could", "use", "a", "few", "more", "minutes", "because", "this", "menu", "is", "huge"],
            punctuation: ".",
            explanation: "接続詞 `because` の後ろには「主語（`this menu`）＋動詞（`is`）」の完全な節を置く必要があります。"
        },
        {
            prompt: "I finally found that journal article I need for my essay.",
            words: ["article", "the", "read", "I", "you", "when", "assignment", "your", "with", "could", "finished", "are"],
            correctOrder: ["Could", "I", "read", "the", "article", "when", "you", "are", "finished", "with", "your", "assignment"],
            punctuation: "?",
            explanation: "助動詞の疑問文（`Could I + 動詞原形`）の構造と、時を表す副詞節（`when you are finished...`）の正しい骨組みを組み合わせます。"
        },
        {
            prompt: "Most of the people on this trip attend our university.",
            words: ["other", "met", "few", "have", "a", "are", "from", "they", "but", "there", "schools", "that", "I"],
            correctOrder: ["They", "do,", "but", "there", "are", "a", "few", "from", "other", "schools", "that", "I", "have", "met"],
            punctuation: ".",
            explanation: "現在完了形における過去分詞 `have met` の正しい選択と、関係代名詞節の語順ルールを適用します。"
        },
        {
            prompt: "Are you ready to submit your application form?",
            words: ["check", "need", "to", "I", "everything", "one", "last", "time"],
            correctOrder: ["I", "need", "to", "check", "everything", "one", "last", "time"],
            punctuation: ".",
            explanation: "動詞 `need` の目的語として不定詞（`to check`）を取り、その直後には動詞の原形が続きます。"
        },
        {
            prompt: "Did you hear about the sudden change in the project deadline?",
            words: ["email", "an", "about", "morning", "this", "received", "I"],
            correctOrder: ["I", "received", "an", "email", "about", "this", "morning"],
            punctuation: ".",
            explanation: "主語・動詞・目的語（SVO）の基本構造に従い、時を示す副詞句を適切に配置します。"
        },
        {
            prompt: "Do you know where Professor Davis is right now?",
            words: ["office", "his", "in", "be", "might", "he"],
            correctOrder: ["He", "might", "be", "in", "his", "office"],
            punctuation: ".",
            explanation: "助動詞 `might` の直後には必ず動詞の原形（`be`）を置きます。"
        },
        {
            prompt: "How was your presentation in front of the class yesterday?",
            words: ["well", "very", "it", "went"],
            correctOrder: ["It", "went", "very", "well"],
            punctuation: ".",
            explanation: "自動詞 `went` の修飾語として、副詞 `very well` を正しい語順で配置します。"
        },
        {
            prompt: "Why didn't you join us for lunch yesterday?",
            words: ["finish", "report", "have", "I", "to", "my"],
            correctOrder: ["I", "had", "to", "finish", "my", "report"],
            punctuation: ".",
            explanation: "過去の義務を表す `had to` の後ろには動詞の原形（`finish`）が続きます。"
        },
        {
            prompt: "Have you decided where you are going for the summer vacation?",
            words: ["to", "plan", "Japan", "I", "visit"],
            correctOrder: ["I", "plan", "to", "visit", "Japan"],
            punctuation: ".",
            explanation: "動詞 `plan` の後ろに不定詞（`to visit`）を置き、その後に目的語を続けます。"
        },
        {
            prompt: "Is it going to rain this afternoon according to the forecast?",
            words: ["take", "an", "umbrella", "better", "you'd"],
            correctOrder: ["You'd", "better", "take", "an", "umbrella"],
            punctuation: ".",
            explanation: "助動詞的表現 `had better` の後ろには動詞の原形（`take`）が来ます。"
        },
        {
            prompt: "Do you need any help carrying those heavy boxes?",
            words: ["manage", "I", "myself", "on", "can", "it"],
            correctOrder: ["I", "can", "manage", "it", "myself"],
            punctuation: ".",
            explanation: "助動詞 `can` の後ろには動詞の原形（`manage`）を置きます。"
        },
        {
            prompt: "When will the new software update be available for download?",
            words: ["released", "next", "week", "it", "be", "will"],
            correctOrder: ["It", "will", "be", "released", "next", "week"],
            punctuation: ".",
            explanation: "受動態の文において、助動詞 `will` の後には `be`、さらに過去分詞（`released`）を続けます。"
        },
        {
            prompt: "Are you planning to attend the conference in Chicago next month?",
            words: ["sure", "not", "I'm", "yet"],
            correctOrder: ["I'm", "not", "sure", "yet"],
            punctuation: ".",
            explanation: "否定を表す `not` の位置と、文末の副詞 `yet` の配置を正確に行います。"
        },
        {
            prompt: "Did you find the book you were looking for in the library?",
            words: ["borrow", "can", "it", "I", "if", "wonder", "I"],
            correctOrder: ["I", "wonder", "if", "I", "can", "borrow", "it"],
            punctuation: ".",
            explanation: "接続詞 `if` の後には「主語＋助動詞＋動詞の原形（`I can borrow`）」という節の構造を崩さずに入れます。"
        },
        {
            prompt: "What time does the flight to New York depart tomorrow?",
            words: ["leaving", "is", "it", "morning", "tomorrow"],
            correctOrder: ["It", "is", "leaving", "tomorrow", "morning"],
            punctuation: ".",
            explanation: "現在進行形（`is leaving`）の構造において、be動詞と現在分詞の組み合わせを正しく保ちます。"
        },
        {
            prompt: "Can I borrow your laptop for a few minutes to check my email?",
            words: ["back", "give", "you", "I'll", "it", "shortly"],
            correctOrder: ["I'll", "give", "it", "back", "to", "you", "shortly"],
            punctuation: ".",
            explanation: "代名詞の目的語（`it`）が動詞と副詞（`give back`）の間に入るルールと、未来の助動詞表現（`I'll`）を処理します。"
        },
        {
            prompt: "Have you seen my car keys anywhere in the kitchen?",
            words: ["on", "left", "them", "table", "the", "you", "might", "have"],
            correctOrder: ["You", "might", "have", "left", "them", "on", "the", "table"],
            punctuation: ".",
            explanation: "過去の推量を表す `might have` の後ろには過去分詞（`left`）を置きます。"
        },
        {
            prompt: "How was the final exam for your advanced economics class?",
            words: ["expected", "harder", "it", "was", "much", "than"],
            correctOrder: ["It", "was", "much", "harder", "than", "expected"],
            punctuation: ".",
            explanation: "比較級（`harder`）を強調する `much` の位置と、慣用表現（`than expected`）の語順を正しく組み立てます。"
        },
        {
            prompt: "Are you satisfied with the current progress of the team project?",
            words: ["room", "improvement", "for", "is", "there", "still"],
            correctOrder: ["There", "is", "still", "room", "for", "improvement"],
            punctuation: ".",
            explanation: "`There is` 構文において、副詞 `still` の位置と名詞句のコロケーション（`room for improvement`）を崩さずに配置します。"
        },
        {
            prompt: "Do you know how to operate this new audio equipment?",
            words: ["manual", "read", "first", "should", "the", "you"],
            correctOrder: ["You", "should", "read", "the", "manual", "first"],
            punctuation: ".",
            explanation: "助動詞 `should` の直後に動詞の原形（`read`）を置く基本文型です。"
        },
        {
            prompt: "Why did you decide to change your major to computer science?",
            words: ["career", "better", "offer", "it", "prospects", "will"],
            correctOrder: ["It", "will", "offer", "better", "career", "prospects"],
            punctuation: ".",
            explanation: "助動詞 `will` の後に動詞の原形（`offer`）を置き、目的語とのバランスを保ちます。"
        },
        {
            prompt: "Would you like to join us for dinner after the seminar?",
            words: ["love", "to", "I'd"],
            correctOrder: ["I'd", "love", "to"],
            punctuation: ".",
            explanation: "誘いに対する肯定の定型表現であり、不定詞の `to` で止まる形を正しく選択します。"
        },
        {
            prompt: "Have you finished writing your research paper yet?",
            words: ["finished", "almost", "I'm"],
            correctOrder: ["I'm", "almost", "finished"],
            punctuation: ".",
            explanation: "状態を表す形容詞・分詞（`finished`）の直前に副詞（`almost`）を置く語順を把握します。"
        },
        {
            prompt: "Is there anything else you need before we start the meeting?",
            words: ["good", "all", "we're"],
            correctOrder: ["We're", "all", "good"],
            punctuation: ".",
            explanation: "「準備万端である」という口語表現における代名詞・副詞・形容詞の配置を正しく組み立てます。"
        },
        {
            prompt: "Do you mind if I open the window for some fresh air?",
            words: ["ahead", "go"],
            correctOrder: ["Go", "ahead"],
            punctuation: ".",
            explanation: "許可を与える際の短い慣用表現（命令文）の正しい語順を維持します。"
        }
    ];

    let currentIndex = 0;
    let currentTime = 40;
    let timerInterval;
    let userSelectedWords = [];
    let availableWords = [];
    let isAnswered = false;

    function startTimer() {
        clearInterval(timerInterval);
        currentTime = 40;
        const timerElement = document.getElementById('timer');
        timerElement.classList.remove('negative');
        timerElement.innerHTML = `⏱ ${currentTime} s`;

        timerInterval = setInterval(() => {
            currentTime--;
            if (currentTime >= 0) {
                timerElement.innerHTML = `⏱ ${currentTime} s`;
                timerElement.classList.remove('negative');
            } else {
                timerElement.innerHTML = `⏱ ${currentTime} s`;
                timerElement.classList.add('negative');
            }
        }, 1000);
    }

    function loadQuestion() {
        isAnswered = false;
        userSelectedWords = [];
        
        const currentProblem = problems[currentIndex];
        document.getElementById('prompt-text').textContent = currentProblem.prompt;
        document.getElementById('progress-text').textContent = `Question ${currentIndex + 1} of ${problems.length}`;
        
        availableWords = [...currentProblem.words]
            .map(word => ({ text: word, sort: Math.random() }))
            .sort((a, b) => a.sort - b.sort)
            .map(item => item.text);

        document.getElementById('submit-btn').style.display = 'inline-block';
        document.getElementById('submit-btn').disabled = false;
        document.getElementById('next-btn').style.display = 'none';
        
        document.getElementById('explanation-box').classList.remove('show');

        render();
        startTimer();
    }

    function render() {
        const dropZone = document.getElementById('drop-zone');
        const wordBank = document.getElementById('word-bank');
        
        dropZone.innerHTML = '';
        wordBank.innerHTML = '';

        userSelectedWords.forEach((word, index) => {
            const chip = document.createElement('div');
            chip.className = 'chip';
            chip.textContent = word;
            if (!isAnswered) {
                chip.onclick = () => moveToWordBank(index);
            }
            dropZone.appendChild(chip);
        });

        if (userSelectedWords.length === 0 && !isAnswered) {
            const placeholder = document.createElement('span');
            placeholder.style.color = 'var(--text-muted)';
            placeholder.style.fontSize = '0.9rem';
            placeholder.style.padding = '4px';
            placeholder.textContent = 'Tap words below to build your sentence...';
            dropZone.appendChild(placeholder);
        }

        const punct = document.createElement('span');
        punct.textContent = problems[currentIndex].punctuation;
        punct.style.fontSize = '1.2rem';
        punct.style.fontWeight = 'bold';
        punct.style.color = 'var(--text-muted)';
        dropZone.appendChild(punct);

        availableWords.forEach((word, index) => {
            const chip = document.createElement('div');
            chip.className = 'chip';
            chip.textContent = word;
            if (!isAnswered) {
                chip.onclick = () => moveToDropZone(index);
            }
            wordBank.appendChild(chip);
        });
    }

    function moveToDropZone(index) {
        if (isAnswered) return;
        const word = availableWords.splice(index, 1)[0];
        userSelectedWords.push(word);
        render();
    }

    function moveToWordBank(index) {
        if (isAnswered) return;
        const word = userSelectedWords.splice(index, 1)[0];
        availableWords.push(word);
        render();
    }

    function checkAnswer() {
        if (isAnswered) return;
        
        const currentProblem = problems[currentIndex];

        if (userSelectedWords.length !== currentProblem.correctOrder.length) {
            alert("すべての単語を配置してください。");
            return;
        }

        isAnswered = true;
        clearInterval(timerInterval);

        const isCorrect = userSelectedWords.every((val, index) => val === currentProblem.correctOrder[index]);

        document.getElementById('submit-btn').disabled = true;
        if (currentIndex < problems.length - 1) {
            document.getElementById('next-btn').style.display = 'inline-block';
        }

        const indicator = document.getElementById('result-indicator');
        const content = document.getElementById('explanation-content');
        const box = document.getElementById('explanation-box');

        if (isCorrect) {
            indicator.className = "result-indicator correct";
            indicator.textContent = "Correct!";
        } else {
            indicator.className = "result-indicator incorrect";
            indicator.textContent = "Incorrect. Correct Answer: " + currentProblem.correctOrder.join(" ") + currentProblem.punctuation;
        }

        content.innerHTML = `<strong>Explanation:</strong><br>${currentProblem.explanation}`;
        box.classList.add('show');
    }

    function nextQuestion() {
        if (currentIndex < problems.length - 1) {
            currentIndex++;
            loadQuestion();
        }
    }

    window.onload = loadQuestion;
</script>

</body>
</html>
