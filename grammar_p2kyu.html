<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eiken Grade Pre-2 - Build a Sentence Practice (30 Questions)</title>
    <style>
        :root {
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --border-color: #cbd5e1;
            --success: #16a34a;
            --error: #dc2626;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 1.25rem;
            margin: 0;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .timer-box {
            font-size: 1.1rem;
            font-weight: bold;
            background: #f1f5f9;
            padding: 6px 14px;
            border-radius: 20px;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border-color);
            transition: all 0.3s;
        }

        .timer-box.warning {
            background: #fef2f2;
            color: var(--error);
            border-color: #fca5a5;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .instructions {
            font-size: 0.95rem;
            color: #64748b;
            margin-bottom: 15px;
        }

        .progress {
            font-size: 0.85rem;
            font-weight: bold;
            color: #64748b;
            margin-bottom: 15px;
        }

        .prompt-box {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .statement {
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 1.05rem;
        }

        .sentence-builder {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 64px;
            padding: 12px;
            background: #ffffff;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            align-items: center;
            margin-bottom: 15px;
        }

        .fixed-word {
            background: #e2e8f0;
            border: 1px solid #cbd5e1;
            color: #475569;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            user-select: none;
        }

        .blank-slot {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 60px;
            min-height: 40px;
            padding: 4px 8px;
            background: #f8fafc;
            border: 2px dashed #94a3b8;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .blank-slot.drag-over {
            background: #e0f2fe;
            border-color: var(--primary);
        }

        .word-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 54px;
            padding: 12px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            align-items: center;
        }

        .word-pool-label {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 5px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .word-chip {
            background: #ffffff;
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: grab;
            font-size: 0.95rem;
            user-select: none;
            touch-action: none;
            transition: all 0.2s ease;
        }

        .word-chip:active {
            cursor: grabbing;
        }

        .word-chip.dragging {
            opacity: 0.4;
        }

        .punctuation-mark {
            font-weight: bold;
            font-size: 1.1rem;
            margin-left: 4px;
            color: #334155;
            align-self: flex-end;
            padding-bottom: 8px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
        }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            font-size: 0.95rem;
            min-height: 24px;
        }

        .feedback.correct {
            color: var(--success);
        }

        .feedback.incorrect {
            color: var(--error);
        }

        .explanation-box {
            margin-top: 15px;
            padding: 15px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            color: #166534;
        }

        .review-label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            font-size: 0.9rem;
            font-weight: normal;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-row">
        <h1>Eiken Grade Pre-2 Practice</h1>
        <div class="timer-box" id="timerBox">
            ⏱️ <span id="timerText">30</span>s
        </div>
    </div>
    <div class="instructions">英検準2級レベル（不定詞の応用、動名詞・分詞構文、関係代名詞の継続用法・目的格の省略、仮定法過去、使役・知覚動詞など）の並び替え問題を解きましょう。</div>
    
    <div class="progress" id="progress">Question 1 of 30</div>
    
    <div class="prompt-box">
        <div class="statement" id="statementText">Loading...</div>
        
        <div class="sentence-builder" id="sentenceBuilder"></div>
        
        <div class="word-pool-label">Word Bank (Drag / Tap & Drop)</div>
        <div class="word-pool" id="wordPool" ondragover="allowDrop(event)" ondragleave="removePoolStyle(event)" ondrop="dropToPool(event)"></div>
    </div>

    <!-- 解説・レビューエリア -->
    <div id="explanationContainer" class="explanation-box hidden">
        <div id="explanationText"></div>
        <label class="review-label">
            <input type="checkbox" id="reviewCheckbox" onchange="toggleReview()"> 正しい答えと文法解説を確認しました
        </label>
    </div>

    <div class="controls">
        <button id="checkBtn" onclick="checkAnswer()">Check Answer</button>
        <button id="nextBtn" onclick="nextQuestion()" style="display: none;" disabled>Next Question</button>
    </div>

    <div class="feedback" id="feedback"></div>
</div>

<script>
    const questions = [
        // 1. 不定詞の応用 (too 〜 to ...)
        {
            context: "その箱は重すぎて私には持ち上げられません。",
            parts: [
                { fixed: false, target: "The" },
                { fixed: false, target: "box" },
                { fixed: false, target: "was" },
                { fixed: false, target: "too" },
                { fixed: false, target: "heavy" },
                { fixed: false, target: "for" },
                { fixed: false, target: "me" },
                { fixed: true, target: "to" },
                { fixed: true, target: "lift" }
            ],
            punctuation: ".",
            explanation: "「あまりに〜なので…できない」を表す「too 〜 for [人] to ...」の構文です。"
        },
        // 2. 不定詞の応用 (enough to ...)
        {
            context: "彼はその車を買うのに十分なお金持ちです。",
            parts: [
                { fixed: false, target: "He" },
                { fixed: false, target: "is" },
                { fixed: false, target: "rich" },
                { fixed: false, target: "enough" },
                { fixed: false, target: "to" },
                { fixed: true, target: "buy" },
                { fixed: true, target: "the" },
                { fixed: true, target: "car" }
            ],
            punctuation: ".",
            explanation: "「…するのに十分〜だ」は「[形容詞/副詞] enough to do」の語順になります。"
        },
        // 3. 関係代名詞の目的格の省略
        {
            context: "あれは私が昨日買った本です。",
            parts: [
                { fixed: false, target: "That" },
                { fixed: false, target: "is" },
                { fixed: false, target: "the" },
                { fixed: false, target: "book" },
                { fixed: false, target: "I" },
                { fixed: false, target: "bought" },
                { fixed: true, target: "yesterday" }
            ],
            punctuation: ".",
            explanation: "関係代名詞の目的格（which / that）は省略できるため、名詞の直後に主語・動詞を続けることができます。"
        },
        // 4. 関係代名詞 whose
        {
            context: "あそこにいる少女は父親が医師です。",
            parts: [
                { fixed: false, target: "The" },
                { fixed: false, target: "girl" },
                { fixed: false, target: "whose" },
                { fixed: false, target: "father" },
                { fixed: false, target: "is" },
                { fixed: true, target: "a" },
                { fixed: true, target: "doctor" },
                { fixed: true, target: "is" },
                { fixed: true, target: "over" },
                { fixed: true, target: "there" }
            ],
            punctuation: ".",
            explanation: "「〜の」という所有を表す関係代名詞 whose を使って先行詞を修飾します。"
        },
        // 5. 関係副詞 where
        {
            context: "ここは私が生まれた町です。",
            parts: [
                { fixed: false, target: "This" },
                { fixed: false, target: "is" },
                { fixed: false, target: "the" },
                { fixed: false, target: "town" },
                { fixed: false, target: "where" },
                { fixed: false, target: "I" },
                { fixed: true, target: "was" },
                { fixed: true, target: "born" }
            ],
            punctuation: ".",
            explanation: "場所を先行詞にとる関係副詞 where を用いて、後ろから文を続けます。"
        },
        // 6. 分詞の形容詞的用法 (過去分詞による後置修飾)
        {
            context: "英語で書かれたその手紙を読みました。",
            parts: [
                { fixed: false, target: "I" },
                { fixed: false, target: "read" },
                { fixed: false, target: "the" },
                { fixed: false, target: "letter" },
                { fixed: false, target: "written" },
                { fixed: true, target: "in" },
                { fixed: true, target: "English" }
            ],
            punctuation: ".",
            explanation: "過去分詞のカタマリ（written in English）が名詞を後ろから修飾しています。"
        },
        // 7. 動名詞を目的語にとる動詞 (practice)
        {
            context: "彼は毎日英語を話す練習をしています。",
            parts: [
                { fixed: false, target: "He" },
                { fixed: false, target: "practices" },
                { fixed: false, target: "speaking" },
                { fixed: false, target: "English" },
                { fixed: true, target: "every" },
                { fixed: true, target: "day" }
            ],
            punctuation: ".",
            explanation: "動詞 practice は後ろに動名詞（speaking）を目的語にとります。"
        },
        // 8. 動名詞の慣用表現 (look forward to 〜ing)
        {
            context: "あなたにお会いできるのを楽しみにしております。",
            parts: [
                { fixed: false, target: "I" },
                { fixed: false, target: "am" },
                { fixed: false, target: "looking" },
                { fixed: false, target: "forward" },
                { fixed: false, target: "to" },
                { fixed: false, target: "seeing" },
                { fixed: true, target: "you" }
            ],
            punctuation: ".",
            explanation: "「look forward to 〜ing」の to は前置詞なので、後ろに動名詞（seeing）がきます。"
        },
        // 9. 動名詞の慣用表現 (spend 〜ing)
        {
            context: "私は週末に本を読んで過ごしました。",
            parts: [
                { fixed: false, target: "I" },
                { fixed: false, target: "spent" },
                { fixed: false, target: "the" },
                { fixed: false, target: "weekend" },
                { fixed: false, target: "reading" },
                { fixed: true, target: "books" }
            ],
            punctuation: ".",
            explanation: "「[時間・お金] spend 〜ing」の形で「〜して（時間など）を費やす」を表します。"
        },
        // 10. 仮定法過去 (基本)
        {
            context: "もし私にお金があれば、その車を買うのですが。",
            parts: [
                { fixed: false, target: "If" },
                { fixed: false, target: "I" },
                { fixed: false, target: "had" },
                { fixed: false, target: "money" },
                { fixed: false, target: "I" },
                { fixed: false, target: "would" },
                { fixed: true, target: "buy" },
                { fixed: true, target: "the" },
                { fixed: true, target: "car" }
            ],
            punctuation: ".",
            explanation: "現在の事実とは異なる仮定を表す仮定法過去は「If + 主語 + 過去形, 主語 + 조동詞の過去形 + 原形」にします。"
        },
        // 11. 仮定法過去 (be動詞はwere)
        {
            context: "もし私があなたなら、そんなことはしないのに。",
            parts: [
                { fixed: false, target: "If" },
                { fixed: false, target: "I" },
                { fixed: false, target: "were" },
                { fixed: false, target: "you" },
                { fixed: false, target: "I" },
                { fixed: false, target: "would" },
                { fixed: true, target: "not" },
                { fixed: true, target: "do" },
                { fixed: true, target: "that" }
            ],
            punctuation: ".",
            explanation: "仮定法過去では、主語にかかわらず be動詞は原則として were を用います。"
        },
        // 12. 使役動詞 (have 人 過去分詞)
        {
            context: "私は髪を切ってもらいました。",
            parts: [
                { fixed: false, target: "I" },
                { fixed: false, target: "had" },
                { fixed: false, target: "my" },
                { fixed: false, target: "hair" },
                { fixed: false, target: "cut" },
                { fixed: true, target: "yesterday" }
            ],
            punctuation: ".",
            explanation: "「have + 目的語 + 過去分詞」で「〜を（人に）してもらう・されてしまう」という受動の意味を表します。"
        },
        // 13. 知覚動詞 (see 人 〜ing)
        {
            context: "私は彼が走っているのを見ました。",
            parts: [
                { fixed: false, target: "I" },
                { fixed: false, target: "saw" },
                { fixed: false, target: "him" },
                { fixed: false, target: "running" },
                { fixed: true, target: "in" },
                { fixed: true, target: "the" },
                { fixed: true, target: "park" }
            ],
            punctuation: ".",
            explanation: "知覚動詞 (saw) の後ろに「目的語 + 現在分詞（running）」を置くと「〜が…しているのを見る」となります。"
        },
        // 14. 受動態の応用 (進行形の受動態)
        {
            context: "その橋は現在建設中です。",
            parts: [
                { fixed: false, target: "The" },
                { fixed: false, target: "bridge" },
                { fixed: false, target: "is" },
                { fixed: false, target: "being" },
                { fixed: false, target: "built" },
                { fixed: true, target: "now" }
            ],
            punctuation: ".",
            explanation: "進行形の受動態は「be動詞 + being + 過去分詞（built）」の形をとります。"
        },
        // 15. 受動態の応用 (完了形の受動態)
        {
            context: "その窓はすでに割られています。",
            parts: [
                { fixed: false, target: "The" },
                { fixed: false, target: "window" },
                { fixed: false, target: "has" },
                { fixed: false, target: "been" },
                { fixed: false, target: "broken" },
                { fixed: true, target: "already" }
            ],
            punctuation: ".",
            explanation: "完了形の受動態は「have/has + been + 過去分詞（broken）」で表します。"
        },
        // 16. 間接疑問文 (疑問詞が主語になる場合)
        {
            context: "何が起きたのか私にはわかりません。",
            parts: [
                { fixed: false, target: "I" },
                { fixed: false, target: "don't" },
                { fixed: false, target: "know" },
                { fixed: false, target: "what" },
                { fixed: false, target: "happened" },
                { fixed: true, target: "there" }
            ],
            punctuation: ".",
            explanation: "疑問詞（What）自体が主語を兼ねている場合、「What + 動詞（happened）」の順になります。"
        },
        // 17. 否定の強調 (not 〜 at all)
        {
            context: "私はその映画を全く面白いと思いませんでした。",
            parts: [
                { fixed: false, target: "I" },
                { fixed: false, target: "did" },
                { fixed: false, target: "not" },
                { fixed: false, target: "find" },
                { fixed: false, target: "the" },
                { fixed: false, target: "movie" },
                { fixed: false, target: "interesting" },
                { fixed: true, target: "at" },
                { fixed: true, target: "all" }
            ],
            punctuation: ".",
            explanation: "「not 〜 at all」で「まったく〜ない」と否定を強く強調する表現になります。"
        },
        // 18. 部分否定 (not everyone)
        {
            context: "すべての人が英語を話せるわけではありません。",
            parts: [
                { fixed: false, target: "Not" },
                { fixed: false, target: "everyone" },
                { fixed: false, target: "can" },
                { fixed: false, target: "speak" },
                { fixed: true, target: "English" }
            ],
            punctuation: ".",
            explanation: "「Not + 全体を表す語（everyone）」で「すべてが〜というわけではない（部分否定）」を表します。"
        },
        // 19. 頻度を表す副詞の位置 (hardly)
        {
            context: "彼はほとんど朝食を食べません。",
            parts: [
                { fixed: false, target: "He" },
                { fixed: false, target: "hardly" },
                { fixed: false, target: "eats" },
                { fixed: true, target: "breakfast" },
                { fixed: true, target: "in" },
                { fixed: true, target: "the" },
                { fixed: true, target: "morning" }
            ],
            punctuation: ".",
            explanation: "準否定語である hardly（ほとんど〜ない）は、一般動詞の前（または助動詞の後ろ）に置きます。"
        },
        // 20. 接続詞の応用 (whether or not)
        {
            context: "彼が来るかどうか私にはわかりません。",
            parts: [
                { fixed: false, target: "I" },
                { fixed: false, target: "don't" },
                { fixed: false, target: "know" },
                { fixed: false, target: "whether" },
                { fixed: false, target: "he" },
                { fixed: false, target: "will" },
                { fixed: true, target: "come" },
                { fixed: true, target: "or" },
                { fixed: true, target: "not" }
            ],
            punctuation: ".",
            explanation: "「〜かどうか」を表す接続詞 whether に or not を伴った表現です。"
        },
        // 21. 譲歩の表現 (No matter how)
        {
            context: "どんなに疲れていても、彼は仕事を続けました。",
            parts: [
                { fixed: false, target: "No" },
                { fixed: false, target: "matter" },
                { fixed: false, target: "how" },
                { fixed: false, target: "tired" },
                { fixed: false, target: "he" },
                { fixed: false, target: "was" },
                { fixed: true, target: "he" },
                { fixed: true, target: "kept" },
                { fixed: true, target: "working" }
            ],
            punctuation: ".",
            explanation: "「No matter how + 形容詞/副詞 + 主語 + 動詞」で「どんなに〜でも」という譲歩を表します。"
        },
        // 22. 無生物主語の構文
        {
            context: "この道を行けば駅に行けます。",
            parts: [
                { fixed: false, target: "This" },
                { fixed: false, target: "road" },
                { fixed: false, target: "will" },
                { fixed: false, target: "take" },
                { fixed: false, target: "you" },
                { fixed: true, target: "to" },
                { fixed: true, target: "the" },
                { fixed: true, target: "station" }
            ],
            punctuation: ".",
            explanation: "無生物（This road）を主語にして「〜が…へ連れて行く/導く」とする英語らしい表現です。"
        },
        // 23. 数量の表現 (both A and B)
        {
            context: "トムもメアリーもテニスが好きです。",
            parts: [
                { fixed: false, target: "Both" },
                { fixed: false, target: "Tom" },
                { fixed: false, target: "and" },
                { fixed: false, target: "Mary" },
                { fixed: false, target: "like" },
                { fixed: true, target: "tennis" }
            ],
            punctuation: ".",
            explanation: "「AもBも両方とも」は「Both A and B」で表し、動詞は複数扱いになります。"
        },
        // 24. 数量の表現 (either A or B)
        {
            context: "あなたか私のどちらかがそこに行くべきです。",
            parts: [
                { fixed: false, target: "Either" },
                { fixed: false, target: "you" },
                { fixed: false, target: "or" },
                { fixed: false, target: "I" },
                { fixed: false, target: "should" },
                { fixed: true, target: "go" },
                { fixed: true, target: "there" }
            ],
            punctuation: ".",
            explanation: "「AかBかどちらか」は「Either A or B」で表します。"
        },
        // 25. 数量の表現 (neither A nor B)
        {
            context: "彼も彼女もその真実を知りませんでした。",
            parts: [
                { fixed: false, target: "Neither" },
                { fixed: false, target: "he" },
                { fixed: false, target: "nor" },
                { fixed: false, target: "she" },
                { fixed: false, target: "knew" },
                { fixed: true, target: "the" },
                { fixed: true, target: "truth" }
            ],
            punctuation: ".",
            explanation: "「AもBもどちらも〜ない」という否定は「Neither A nor B」を使います。"
        },
        // 26. 比較の応用 (倍数表現 twice as 〜 as)
        {
            context: "この部屋はあの部屋の2倍の広さがあります。",
            parts: [
                { fixed: false, target: "This" },
                { fixed: false, target: "room" },
                { fixed: false, target: "is" },
                { fixed: false, target: "twice" },
                { fixed: false, target: "as" },
                { fixed: false, target: "large" },
                { fixed: false, target: "as" },
                { fixed: true, target: "that" },
                { fixed: true, target: "one" }
            ],
            punctuation: ".",
            explanation: "「〜の2倍の…」は「twice as + 形容詞の原級 + as」の形で表します。"
        },
        // 27. 比較の応用 (the 比較級 〜, the 比較級 ...)
        {
            context: "かければかけるほど、その本は面白くなります。",
            parts: [
                { fixed: false, target: "The" },
                { fixed: false, target: "more" },
                { fixed: false, target: "you" },
                { fixed: false, target: "read" },
                { fixed: false, target: "the" },
                { fixed: false, target: "book" },
                { fixed: true, target: "the" },
                { fixed: true, target: "more" },
                { fixed: true, target: "interesting" },
                { fixed: true, target: "it" },
                { fixed: true, target: "becomes" }
            ],
            punctuation: ".",
            explanation: "「すればするほど、ますます〜」は「The 比較級 〜, the 比較級 ...」の構文を使います。"
        },
        // 28. 同格の that
        {
            context: "彼は彼が試験に合格したというニュースを聞きました。",
            parts: [
                { fixed: false, target: "He" },
                { fixed: false, target: "heard" },
                { fixed: false, target: "the" },
                { fixed: false, target: "news" },
                { fixed: false, target: "that" },
                { fixed: false, target: "he" },
                { fixed: true, target: "passed" },
                { fixed: true, target: "the" },
                { fixed: true, target: "exam" }
            ],
            punctuation: ".",
            explanation: "名詞の内容を具体的に説明する「同格の that 節」を用いた表現です。"
        },
        // 29. 強調構文 (It is 〜 that ...)
        {
            context: "昨日公園でメアリーに出会ったのはトムでした。",
            parts: [
                { fixed: false, target: "It" },
                { fixed: false, target: "was" },
                { fixed: false, target: "Tom" },
                { fixed: false, target: "that" },
                { fixed: false, target: "met" },
                { fixed: true, target: "Mary" },
                { fixed: true, target: "in" },
                { fixed: true, target: "the" },
                { fixed: true, target: "park" },
                { fixed: true, target: "yesterday" }
            ],
            punctuation: ".",
            explanation: "特定の語句を強調する「It is/was 〜 that ...」の強調構文です。"
        },
        // 30. 関係代名詞の継続用法 (which)
        {
            context: "彼は昨夜遅くまで起きていましたが、それは健康に良くありません。",
            parts: [
                { fixed: false, target: "He" },
                { fixed: false, target: "stayed" },
                { fixed: false, target: "up" },
                { fixed: false, target: "late" },
                { fixed: false, target: "last" },
                { fixed: false, target: "night," },
                { fixed: true, target: "which" },
                { fixed: true, target: "is" },
                { fixed: true, target: "not" },
                { fixed: true, target: "good" },
                { fixed: true, target: "for" },
                { fixed: true, target: "health" }
            ],
            punctuation: ".",
            explanation: "コンマの後に続く関係代名詞の継続用法（which）で、前の文全体や内容を受けて説明を加えます。"
        }
    ];

    let currentIdx = 0;
    let draggedChip = null;
    let timeLeft = 30;
    let timerInterval = null;
    let isAnswered = false;

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 30;
        isAnswered = false;
        updateTimerDisplay();

        const timerBox = document.getElementById('timerBox');
        timerBox.classList.remove('warning');

        timerInterval = setInterval(() => {
            if (isAnswered) return;
            timeLeft--;
            updateTimerDisplay();

            if (timeLeft <= 0) {
                if (!timerBox.classList.contains('warning')) {
                    timerBox.classList.add('warning');
                }
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const timerText = document.getElementById('timerText');
        timerText.innerText = timeLeft;
    }

    function loadQuestion() {
        const q = questions[currentIdx];
        document.getElementById('progress').innerText = `Question ${currentIdx + 1} of ${questions.length}`;
        document.getElementById('statementText').innerText = q.context;
        document.getElementById('feedback').innerText = '';
        document.getElementById('feedback').className = 'feedback';
        document.getElementById('checkBtn').style.display = 'inline-block';
        document.getElementById('nextBtn').style.display = 'none';
        
        document.getElementById('explanationContainer').classList.add('hidden');
        document.getElementById('reviewCheckbox').checked = false;

        const builder = document.getElementById('sentenceBuilder');
        const wordPool = document.getElementById('wordPool');
        builder.innerHTML = '';
        wordPool.innerHTML = '';

        let blankTargets = q.parts.filter(p => !p.fixed).map(p => p.target);
        let shuffledPool = [...blankTargets].sort(() => Math.random() - 0.5);

        shuffledPool.forEach(targetText => {
            wordPool.appendChild(createChip(targetText));
        });

        q.parts.forEach((part) => {
            if (part.fixed) {
                const fixedEl = document.createElement('div');
                fixedEl.className = 'fixed-word';
                fixedEl.innerText = part.target;
                builder.appendChild(fixedEl);
            } else {
                const slot = document.createElement('div');
                slot.className = 'blank-slot';
                slot.dataset.target = part.target;

                slot.addEventListener('dragover', (e) => {
                    if (isAnswered) return;
                    e.preventDefault();
                    slot.classList.add('drag-over');
                });
                slot.addEventListener('dragleave', () => {
                    slot.classList.remove('drag-over');
                });
                slot.addEventListener('drop', (e) => {
                    if (isAnswered) return;
                    e.preventDefault();
                    slot.classList.remove('drag-over');
                    if (draggedChip) {
                        if (slot.children.length > 0) {
                            wordPool.appendChild(slot.children[0]);
                        }
                        slot.appendChild(draggedChip);
                    }
                });

                builder.appendChild(slot);
            }
        });

        const punct = document.createElement('div');
        punct.className = 'punctuation-mark';
        punct.innerText = q.punctuation;
        builder.appendChild(punct);

        startTimer();
    }

    function createChip(text) {
        const chip = document.createElement('div');
        chip.className = 'word-chip';
        chip.draggable = true;
        chip.innerText = text;

        chip.addEventListener('dragstart', () => {
            if (isAnswered) return;
            draggedChip = chip;
            setTimeout(() => chip.classList.add('dragging'), 0);
        });
        chip.addEventListener('dragend', () => {
            draggedChip = null;
        });

        chip.addEventListener('touchstart', (e) => {
            if (isAnswered) return;
            draggedChip = chip;
            chip.classList.add('dragging');
        }, {passive: true});

        chip.addEventListener('touchend', (e) => {
            if (isAnswered) return;
            chip.classList.remove('dragging');
            
            const touch = e.changedTouches[0];
            const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);
            
            if (targetElement) {
                const slot = targetElement.closest('.blank-slot');
                const pool = targetElement.closest('.word-pool');
                
                if (slot) {
                    if (slot.children.length > 0) {
                        document.getElementById('wordPool').appendChild(slot.children[0]);
                    }
                    slot.appendChild(chip);
                } else if (pool) {
                    pool.appendChild(chip);
                }
            }
            draggedChip = null;
        });

        return chip;
    }

    function allowDrop(e) {
        if (isAnswered) return;
        e.preventDefault();
        e.currentTarget.style.background = '#f1f5f9';
    }

    function removePoolStyle(e) {
        e.currentTarget.style.background = '#f8fafc';
    }

    function dropToPool(e) {
        if (isAnswered) return;
        e.preventDefault();
        document.getElementById('wordPool').style.background = '#f8fafc';
        if (draggedChip) {
            document.getElementById('wordPool').appendChild(draggedChip);
        }
    }

    function checkAnswer() {
        if (isAnswered) return;
        
        const builder = document.getElementById('sentenceBuilder');
        const slots = builder.querySelectorAll('.blank-slot');
        const feedback = document.getElementById('feedback');

        let allFilled = true;
        let isCorrect = true;

        slots.forEach(slot => {
            if (slot.children.length === 0) {
                allFilled = false;
            } else {
                const userText = slot.children[0].innerText.trim();
                const correctText = slot.dataset.target.trim();
                if (userText.toLowerCase() !== correctText.toLowerCase()) {
                    isCorrect = false;
                }
            }
        });

        if (!allFilled) {
            feedback.innerText = "すべての空欄に単語を置いてください。";
            feedback.className = "feedback incorrect";
            return;
        }

        if (isCorrect) {
            isAnswered = true;
            clearInterval(timerInterval);
            feedback.innerText = "正解です！素晴らしい！";
            feedback.className = "feedback correct";
            document.getElementById('checkBtn').style.display = 'none';
            if (currentIdx < questions.length - 1) {
                document.getElementById('nextBtn').style.display = 'inline-block';
                document.getElementById('nextBtn').disabled = false;
            }
        } else {
            isAnswered = true;
            clearInterval(timerInterval);
            feedback.innerText = "不正解です。以下の正しい文と文法解説を確認してください。";
            feedback.className = "feedback incorrect";
            document.getElementById('checkBtn').style.display = 'none';
            
            const q = questions[currentIdx];
            let fullSentence = q.parts.map(p => p.target).join(" ") + q.punctuation;
            
            const explanationText = document.getElementById('explanationText');
            explanationText.innerHTML = `
                <strong>Correct Sentence:</strong> ${fullSentence}<br>
                <div style="margin-top: 8px; font-weight: normal; color: #166534; line-height: 1.5;">
                    <strong>文法解説:</strong> ${q.explanation}
                </div>
            `;
            document.getElementById('explanationContainer').classList.remove('hidden');
            
            if (currentIdx < questions.length - 1) {
                document.getElementById('nextBtn').style.display = 'inline-block';
                document.getElementById('nextBtn').disabled = true;
            }
        }
    }

    function toggleReview() {
        const checkbox = document.getElementById('reviewCheckbox');
        const nextBtn = document.getElementById('nextBtn');
        if (checkbox.checked) {
            nextBtn.disabled = false;
        } else {
            nextBtn.disabled = true;
        }
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
            loadQuestion();
        } else {
            document.getElementById('progress').innerText = "Complete!";
            document.getElementById('statementText').innerText = "おめでとうございます！英検準2級レベル全30問をすべてクリアしました！";
            document.getElementById('sentenceBuilder').innerHTML = "";
            document.getElementById('wordPool').innerHTML = "";
            document.getElementById('timerBox').style.display = "none";
            document.getElementById('checkBtn').style.display = "none";
            document.getElementById('nextBtn').style.display = "none";
            document.getElementById('explanationContainer').classList.add('hidden');
        }
    }

    loadQuestion();
</script>
