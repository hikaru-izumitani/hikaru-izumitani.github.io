<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>TOEFL iBT - Build a Sentence Practice (100 Questions)</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --border-color: #cbd5e1;
            --success: #16a34a;
            --error: #dc2626;
            --warning: #d97706;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 1.25rem;
            margin: 0;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .timer-box {
            font-size: 1.1rem;
            font-weight: bold;
            background: #f1f5f9;
            padding: 6px 14px;
            border-radius: 20px;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border-color);
            transition: all 0.3s;
        }

        .timer-box.warning {
            background: #fef2f2;
            color: var(--error);
            border-color: #fca5a5;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .instructions {
            font-size: 0.95rem;
            color: #64748b;
            margin-bottom: 15px;
        }

        .progress {
            font-size: 0.85rem;
            font-weight: bold;
            color: #64748b;
            margin-bottom: 15px;
        }

        .prompt-box {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .statement {
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 1.05rem;
        }

        .sentence-builder {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 64px;
            padding: 12px;
            background: #ffffff;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            align-items: center;
            margin-bottom: 15px;
        }

        .fixed-word {
            background: #e2e8f0;
            border: 1px solid #cbd5e1;
            color: #475569;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            user-select: none;
        }

        .blank-slot {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 60px;
            min-height: 40px;
            padding: 4px 8px;
            background: #f8fafc;
            border: 2px dashed #94a3b8;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .blank-slot.drag-over {
            background: #dbeafe;
            border-color: var(--primary);
        }

        .word-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 54px;
            padding: 12px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            align-items: center;
        }

        .word-pool-label {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 5px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .word-chip {
            background: #ffffff;
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: grab;
            font-size: 0.95rem;
            user-select: none;
            transition: all 0.2s ease;
        }

        .word-chip:active {
            cursor: grabbing;
        }

        .word-chip.dragging {
            opacity: 0.4;
        }

        .punctuation-mark {
            font-weight: bold;
            font-size: 1.1rem;
            margin-left: 4px;
            color: #334155;
            align-self: flex-end;
            padding-bottom: 8px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
        }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            font-size: 0.95rem;
            min-height: 24px;
        }

        .feedback.correct {
            color: var(--success);
        }

        .feedback.incorrect {
            color: var(--error);
        }

        .feedback.timeout {
            color: var(--warning);
        }

        .explanation-box {
            margin-top: 15px;
            padding: 15px;
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 8px;
            color: #92400e;
        }

        .review-label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            font-size: 0.9rem;
            font-weight: normal;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<div class="container">
    <div class="header-row">
        <h1>Build a Sentence</h1>
        <div class="timer-box" id="timerBox">
            ⏱️ <span id="timerText">40</span>s
        </div>
    </div>
    <div class="instructions">Move the words into the blanks to create grammatical sentences. If incorrect, review the correct answer before proceeding.</div>
    
    <div class="progress" id="progress">Question 1 of 100</div>
    
    <div class="prompt-box">
        <div class="statement" id="statementText">Loading...</div>
        
        <div class="sentence-builder" id="sentenceBuilder"></div>
        
        <div class="word-pool-label">Word Bank (Drag from here)</div>
        <div class="word-pool" id="wordPool" ondragover="allowDrop(event)" ondragleave="removePoolStyle(event)" ondrop="dropToPool(event)"></div>
    </div>

    <!-- 解説・レビューエリア -->
    <div id="explanationContainer" class="explanation-box hidden">
        <div id="explanationText"></div>
        <label class="review-label">
            <input type="checkbox" id="reviewCheckbox" onchange="toggleReview()"> 正しい答えと解説を確認しました (Review Completed)
        </label>
    </div>

    <div class="controls">
        <button id="checkBtn" onclick="checkAnswer()">Check Answer</button>
        <button id="nextBtn" onclick="nextQuestion()" style="display: none;" disabled>Next Question</button>
    </div>

    <div class="feedback" id="feedback"></div>
</div>

                { fixed: false, target: "for" },
                { fixed: false, target: "the" },
                { fixed: false, target: "application" }
            ],
            punctuation: "?"
        },
        {
            context: "The university career fair is happening next week.",
            parts: [
                { fixed: false, target: "Have" },
                { fixed: false, target: "you" },
                { fixed: false, target: "prepared" },
                { fixed: false, target: "your" },
                { fixed: false, target: "elevator" },
                { fixed: false, target: "pitch" }
            ],
            punctuation: "?"
        },
        {
            context: "I am looking forward to the graduation ceremony.",
            parts: [
                { fixed: false, target: "It" },
                { fixed: false, target: "has" },
                { fixed: false, target: "been" },
                { fixed: false, target: "a" },
                { fixed: false, target: "long" },
                { fixed: false, target: "and" },
                { fixed: false, target: "rewarding" },
                { fixed: false, target: "journey" }
            ],
            punctuation: "."
        }
    ];

    let currentIdx = 0;
    let draggedChip = null;
    let timeLeft = 40;
    let timerInterval = null;
    let isAnswered = false;

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 40;
        isAnswered = false;
        updateTimerDisplay();

        const timerBox = document.getElementById('timerBox');
        timerBox.classList.remove('warning');

        timerInterval = setInterval(() => {
            if (isAnswered) return;
            timeLeft--;
            updateTimerDisplay();

            if (timeLeft <= 0) {
                if (!timerBox.classList.contains('warning')) {
                    timerBox.classList.add('warning');
                }
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const timerText = document.getElementById('timerText');
        timerText.innerText = timeLeft;
    }

    function loadQuestion() {
        const q = questions[currentIdx];
        document.getElementById('progress').innerText = `Question ${currentIdx + 1} of ${questions.length}`;
        document.getElementById('statementText').innerText = q.context;
        document.getElementById('feedback').innerText = '';
        document.getElementById('feedback').className = 'feedback';
        document.getElementById('checkBtn').style.display = 'inline-block';
        document.getElementById('nextBtn').style.display = 'none';
        
        // 解説エリアをリセット
        document.getElementById('explanationContainer').classList.add('hidden');
        document.getElementById('reviewCheckbox').checked = false;

        const builder = document.getElementById('sentenceBuilder');
        const wordPool = document.getElementById('wordPool');
        builder.innerHTML = '';
        wordPool.innerHTML = '';

        let blankTargets = q.parts.filter(p => !p.fixed).map(p => p.target);
        let shuffledPool = [...blankTargets].sort(() => Math.random() - 0.5);

        shuffledPool.forEach(targetText => {
            wordPool.appendChild(createChip(targetText));
        });

        q.parts.forEach((part) => {
            if (part.fixed) {
                const fixedEl = document.createElement('div');
                fixedEl.className = 'fixed-word';
                fixedEl.innerText = part.target;
                builder.appendChild(fixedEl);
            } else {
                const slot = document.createElement('div');
                slot.className = 'blank-slot';
                slot.dataset.target = part.target;

                slot.addEventListener('dragover', (e) => {
                    if (isAnswered) return;
                    e.preventDefault();
                    slot.classList.add('drag-over');
                });
                slot.addEventListener('dragleave', () => {
                    slot.classList.remove('drag-over');
                });
                slot.addEventListener('drop', (e) => {
                    if (isAnswered) return;
                    e.preventDefault();
                    slot.classList.remove('drag-over');
                    if (draggedChip) {
                        if (slot.children.length > 0) {
                            wordPool.appendChild(slot.children[0]);
                        }
                        slot.appendChild(draggedChip);
                    }
                });

                builder.appendChild(slot);
            }
        });

        const punct = document.createElement('div');
        punct.className = 'punctuation-mark';
        punct.innerText = q.punctuation;
        builder.appendChild(punct);

        startTimer();
    }

    function createChip(text) {
        const chip = document.createElement('div');
        chip.className = 'word-chip';
        chip.draggable = true;
        chip.innerText = text;

        chip.addEventListener('dragstart', () => {
            if (isAnswered) return;
            draggedChip = chip;
            setTimeout(() => chip.classList.add('dragging'), 0);
        });
        chip.addEventListener('dragend', () => {
            draggedChip = null;
        });

        return chip;
    }

    function allowDrop(e) {
        if (isAnswered) return;
        e.preventDefault();
        e.currentTarget.style.background = '#f1f5f9';
    }

    function removePoolStyle(e) {
        e.currentTarget.style.background = '#f8fafc';
    }

    function dropToPool(e) {
        if (isAnswered) return;
        e.preventDefault();
        document.getElementById('wordPool').style.background = '#f8fafc';
        if (draggedChip) {
            document.getElementById('wordPool').appendChild(draggedChip);
        }
    }

    function checkAnswer() {
        if (isAnswered) return;
        
        const builder = document.getElementById('sentenceBuilder');
        const slots = builder.querySelectorAll('.blank-slot');
        const feedback = document.getElementById('feedback');

        let allFilled = true;
        let isCorrect = true;

        slots.forEach(slot => {
            if (slot.children.length === 0) {
                allFilled = false;
            } else {
                const userText = slot.children[0].innerText.trim();
                const correctText = slot.dataset.target.trim();
                if (userText.toLowerCase() !== correctText.toLowerCase()) {
                    isCorrect = false;
                }
            }
        });

        if (!allFilled) {
            feedback.innerText = "Please fill in all the blank slots.";
            feedback.className = "feedback incorrect";
            return;
        }

        if (isCorrect) {
            isAnswered = true;
            clearInterval(timerInterval);
            feedback.innerText = "Correct! Great job.";
            feedback.className = "feedback correct";
            document.getElementById('checkBtn').style.display = 'none';
            if (currentIdx < questions.length - 1) {
                document.getElementById('nextBtn').style.display = 'inline-block';
                document.getElementById('nextBtn').disabled = false;
            }
        } else {
            isAnswered = true; // 入力をロック
            clearInterval(timerInterval);
            feedback.innerText = "Incorrect order. Please review the correct answer below.";
            feedback.className = "feedback incorrect";
            document.getElementById('checkBtn').style.display = 'none';
            
            // 正解の文を組み立てて表示する
            const q = questions[currentIdx];
            let fullSentence = q.parts.map(p => p.target).join(" ") + q.punctuation;
            
            const explanationText = document.getElementById('explanationText');
            explanationText.innerHTML = `<strong>Correct Sentence:</strong> ${fullSentence}`;
            document.getElementById('explanationContainer').classList.remove('hidden');
            
            if (currentIdx < questions.length - 1) {
                document.getElementById('nextBtn').style.display = 'inline-block';
                document.getElementById('nextBtn').disabled = true; // レビュー未完了なので非活性
            }
        }
    }

    function toggleReview() {
        const checkbox = document.getElementById('reviewCheckbox');
        const nextBtn = document.getElementById('nextBtn');
        if (checkbox.checked) {
            nextBtn.disabled = false;
        } else {
            nextBtn.disabled = true;
        }
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
            loadQuestion();
        } else {
            document.getElementById('progress').innerText = "Complete!";
            document.getElementById('statementText').innerText = "Congratulations! You have finished all 100 questions.";
            document.getElementById('sentenceBuilder').innerHTML = "";
            document.getElementById('wordPool').innerHTML = "";
            document.getElementById('timerBox').style.display = "none";
            document.getElementById('checkBtn').style.display = "none";
            document.getElementById('nextBtn').style.display = "none";
            document.getElementById('explanationContainer').classList.add('hidden');
        }
    }

    loadQuestion();
</script>

</body>
</html>
