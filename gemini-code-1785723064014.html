<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eiken Grade 2 - Build a Sentence Practice (30 Questions)</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --border-color: #cbd5e1;
            --success: #16a34a;
            --error: #dc2626;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 1.25rem;
            margin: 0;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .timer-box {
            font-size: 1.1rem;
            font-weight: bold;
            background: #f1f5f9;
            padding: 6px 14px;
            border-radius: 20px;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border-color);
            transition: all 0.3s;
        }

        .timer-box.warning {
            background: #fef2f2;
            color: var(--error);
            border-color: #fca5a5;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .instructions {
            font-size: 0.95rem;
            color: #64748b;
            margin-bottom: 15px;
        }

        .progress {
            font-size: 0.85rem;
            font-weight: bold;
            color: #64748b;
            margin-bottom: 15px;
        }

        .prompt-box {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .statement {
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 1.05rem;
        }

        .sentence-builder {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 64px;
            padding: 12px;
            background: #ffffff;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            align-items: center;
            margin-bottom: 15px;
        }

        .fixed-word {
            background: #e2e8f0;
            border: 1px solid #cbd5e1;
            color: #475569;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            user-select: none;
        }

        .blank-slot {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 60px;
            min-height: 40px;
            padding: 4px 8px;
            background: #f8fafc;
            border: 2px dashed #94a3b8;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .blank-slot.drag-over {
            background: #e0e7ff;
            border-color: var(--primary);
        }

        .word-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 54px;
            padding: 12px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            align-items: center;
        }

        .word-pool-label {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 5px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .word-chip {
            background: #ffffff;
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: grab;
            font-size: 0.95rem;
            user-select: none;
            touch-action: none;
            transition: all 0.2s ease;
        }

        .word-chip:active {
            cursor: grabbing;
        }

        .word-chip.dragging {
            opacity: 0.4;
        }

        .punctuation-mark {
            font-weight: bold;
            font-size: 1.1rem;
            margin-left: 4px;
            color: #334155;
            align-self: flex-end;
            padding-bottom: 8px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
        }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            font-size: 0.95rem;
            min-height: 24px;
        }

        .feedback.correct {
            color: var(--success);
        }

        .feedback.incorrect {
            color: var(--error);
        }

        .explanation-box {
            margin-top: 15px;
            padding: 15px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            color: #166534;
        }

        .review-label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            font-size: 0.9rem;
            font-weight: normal;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-row">
        <h1>Eiken Grade 2 Practice</h1>
        <div class="timer-box" id="timerBox">
            ⏱️ <span id="timerText">30</span>s
        </div>
    </div>
    <div class="instructions">英検2級レベル（関係代名詞の応用、仮定法過去完了、分詞構文、使役・知覚の発展、様々な接続詞・倒置・強調構文など）の並び替え問題を解きましょう。</div>
    
    <div class="progress" id="progress">Question 1 of 30</div>
    
    <div class="prompt-box">
        <div class="statement" id="statementText">Loading...</div>
        
        <div class="sentence-builder" id="sentenceBuilder"></div>
        
        <div class="word-pool-label">Word Bank (Drag / Tap & Drop)</div>
        <div class="word-pool" id="wordPool" ondragover="allowDrop(event)" ondragleave="removePoolStyle(event)" ondrop="dropToPool(event)"></div>
    </div>

    <div id="explanationContainer" class="explanation-box hidden">
        <div id="explanationText"></div>
        <label class="review-label">
            <input type="checkbox" id="reviewCheckbox" onchange="toggleReview()"> 正しい答えと文法解説を確認しました
        </label>
    </div>

    <div class="controls">
        <button id="checkBtn" onclick="checkAnswer()">Check Answer</button>
        <button id="nextBtn" onclick="nextQuestion()" style="display: none;" disabled>Next Question</button>
    </div>

    <div class="feedback" id="feedback"></div>
</div>

<script>
    const questions = [
        {
            context: "もしもっと早く出発していれば、彼は電車に間に合ったのに。",
            parts: [
                { fixed: false, target: "If" },
                { fixed: false, target: "he" },
                { fixed: false, target: "had" },
                { fixed: false, target: "started" },
                { fixed: false, target: "earlier," },
                { fixed: false, target: "he" },
                { fixed: false, target: "would" },
                { fixed: true, target: "have" },
                { fixed: true, target: "caught" },
                { fixed: true, target: "the" },
                { fixed: true, target: "train" }
            ],
            punctuation: ".",
            explanation: "過去の事実に対する仮定を表す仮定法過去完了は「If + 主語 + had 過去分詞, 主語 + 助動詞の過去形 + have 過去分詞」の形をとります。"
        },
        {
            context: "もしその知らせを聞いていたなら、私は彼女に電話しただろうに。",
            parts: [
                { fixed: false, target: "Had" },
                { fixed: false, target: "I" },
                { fixed: false, target: "heard" },
                { fixed: false, target: "the" },
                { fixed: false, target: "news," },
                { fixed: false, target: "I" },
                { fixed: false, target: "would" },
                { fixed: true, target: "have" },
                { fixed: true, target: "called" },
                { fixed: true, target: "her" }
            ],
            punctuation: ".",
            explanation: "仮定法過去完了の if を省略すると、Had が主語の前に出る倒置構文になります。"
        },
        {
            context: "疲れていたので、彼は早めに床につきました。",
            parts: [
                { fixed: false, target: "Being" },
                { fixed: false, target: "tired," },
                { fixed: false, target: "he" },
                { fixed: false, target: "went" },
                { fixed: true, target: "to" },
                { fixed: true, target: "bed" },
                { fixed: true, target: "early" }
            ],
            punctuation: ".",
            explanation: "「〜なので」という理由を表す分詞構文で、Being から文が始まります。"
        },
        {
            context: "天気が良ければ、私たちはピクニックに行くのですが。",
            parts: [
                { fixed: false, target: "The" },
                { fixed: false, target: "weather" },
                { fixed: false, target: "permitting," },
                { fixed: false, target: "we" },
                { fixed: false, target: "will" },
                { fixed: true, target: "go" },
                { fixed: true, target: "on" },
                { fixed: true, target: "a" },
                { fixed: true, target: "picnic" }
            ],
            punctuation: ".",
            explanation: "分詞の意味上の主語が文の主語と異なるため、分詞の前に主語を置く「独立分詞構文」の形です。"
        },
        {
            context: "彼は試験に合格しましたが、それは私を驚かせました。",
            parts: [
                { fixed: false, target: "He" },
                { fixed: false, target: "passed" },
                { fixed: false, target: "the" },
                { fixed: false, target: "exam," },
                { fixed: false, target: "which" },
                { fixed: false, target: "surprised" },
                { fixed: true, target: "me" }
            ],
            punctuation: ".",
            explanation: "コンマの後の which は、直前の節（He passed the exam）全体を先行詞として受けています。"
        },
        {
            context: "来る人は誰でも歓迎されます。",
            parts: [
                { fixed: false, target: "Whoever" },
                { fixed: false, target: "comes" },
                { fixed: false, target: "here" },
                { fixed: false, target: "will" },
                { fixed: true, target: "be" },
                { fixed: true, target: "welcomed" }
            ],
            punctuation: ".",
            explanation: "「〜する人は誰でも」という意味を表す複合関係代名詞 Whoever（= Anyone who）を主語にした文です。"
        },
        {
            context: "どこに行こうとも、私はあなたを忘れません。",
            parts: [
                { fixed: false, target: "Wherever" },
                { fixed: false, target: "you" },
                { fixed: false, target: "may" },
                { fixed: false, target: "go," },
                { fixed: false, target: "I" },
                { fixed: false, target: "will" },
                { fixed: true, target: "not" },
                { fixed: true, target: "forget" },
                { fixed: true, target: "you" }
            ],
            punctuation: ".",
            explanation: "「どこに〜しようとも」という譲歩を表す複合関係副詞 Wherever を用いた表現です。"
        },
        {
            context: "私たちが駅に着くか着かないかのうちに、電車が出発した。",
            parts: [
                { fixed: false, target: "Hardly" },
                { fixed: false, target: "had" },
                { fixed: false, target: "we" },
                { fixed: false, target: "arrived" },
                { fixed: false, target: "at" },
                { fixed: false, target: "the" },
                { fixed: false, target: "station" },
                { fixed: true, target: "when" },
                { fixed: true, target: "the" },
                { fixed: true, target: "train" },
                { fixed: true, target: "left" }
            ],
            punctuation: ".",
            explanation: "否定語 Hardly を文頭に置いたことで、主語と助動詞（had we）が倒置されています。"
        },
        {
            context: "これほど美しい景色を見たことがありません。",
            parts: [
                { fixed: false, target: "Never" },
                { fixed: false, target: "have" },
                { fixed: false, target: "I" },
                { fixed: false, target: "seen" },
                { fixed: true, target: "such" },
                { fixed: true, target: "a" },
                { fixed: true, target: "beautiful" },
                { fixed: true, target: "view" }
            ],
            punctuation: ".",
            explanation: "Never などの強い否定語を文頭に出すことで、助動詞 have と主語 I が倒置されます。"
        },
        {
            context: "彼がその真実を知ったのは、昨日になってからでした。",
            parts: [
                { fixed: false, target: "It" },
                { fixed: false, target: "was" },
                { fixed: false, target: "yesterday" },
                { fixed: false, target: "that" },
                { fixed: false, target: "he" },
                { fixed: false, target: "learned" },
                { fixed: true, target: "the" },
                { fixed: true, target: "truth" }
            ],
            punctuation: ".",
            explanation: "「It was 〜 that ...」の強調構文を使って、副詞（yesterday）を強調しています。"
        },
        {
            context: "そろそろ寝る時間ですよ。",
            parts: [
                { fixed: false, target: "It" },
                { fixed: false, target: "is" },
                { fixed: false, target: "time" },
                { fixed: false, target: "you" },
                { fixed: false, target: "went" },
                { fixed: true, target: "to" },
                { fixed: true, target: "bed" }
            ],
            punctuation: ".",
            explanation: "「そろそろ〜する時間だ」を表す It is time の後ろの節には、仮定法過去（went）が使われます。"
        },
        {
            context: "真実を話してさえくれれば、私はあなたを許します。",
            parts: [
                { fixed: false, target: "Only" },
                { fixed: false, target: "if" },
                { fixed: false, target: "you" },
                { fixed: false, target: "tell" },
                { fixed: false, target: "the" },
                { fixed: false, target: "truth" },
                { fixed: true, target: "will" },
                { fixed: true, target: "I" },
                { fixed: true, target: "forgive" },
                { fixed: true, target: "you" }
            ],
            punctuation: ".",
            explanation: "Only if（〜の場合にのみ）が文頭にあるため、主節側（will I forgive you）で倒置が起きています。"
        },
        {
            context: "私たちは何時間も待たされました。",
            parts: [
                { fixed: false, target: "We" },
                { fixed: false, target: "were" },
                { fixed: false, target: "made" },
                { fixed: false, target: "to" },
                { fixed: false, target: "wait" },
                { fixed: true, target: "for" },
                { fixed: true, target: "hours" }
            ],
            punctuation: ".",
            explanation: "使役動詞 make の受動態では、省略されていた to が復活して「be made to do」の形になります。"
        },
        {
            context: "彼は正直な人だと言われています。",
            parts: [
                { fixed: false, target: "It" },
                { fixed: false, target: "is" },
                { fixed: false, target: "said" },
                { fixed: false, target: "that" },
                { fixed: false, target: "he" },
                { fixed: false, target: "is" },
                { fixed: true, target: "an" },
                { fixed: true, target: "honest" },
                { fixed: true, target: "man" }
            ],
            punctuation: ".",
            explanation: "「It is said that 〜」で「〜だと言われている」という一般伝聞の表現を作ります。"
        },
        {
            context: "彼は私にすぐそこへ行くように要求しました。",
            parts: [
                { fixed: false, target: "He" },
                { fixed: false, target: "demanded" },
                { fixed: false, target: "that" },
                { fixed: false, target: "I" },
                { fixed: false, target: "go" },
                { fixed: true, target: "there" },
                { fixed: true, target: "at" },
                { fixed: true, target: "once" }
            ],
            punctuation: ".",
            explanation: "demand などの要求を表す動詞の後の that 節では、should が省略されて動詞の原形（go）がきます。"
        },
        {
            context: "その問題はあまりに複雑で誰も解けなかった。",
            parts: [
                { fixed: false, target: "So" },
                { fixed: false, target: "complex" },
                { fixed: false, target: "was" },
                { fixed: false, target: "the" },
                { fixed: false, target: "problem" },
                { fixed: false, target: "that" },
                { fixed: true, target: "no" },
                { fixed: true, target: "one" },
                { fixed: true, target: "could" },
                { fixed: true, target: "solve" },
                { fixed: true, target: "it" }
            ],
            punctuation: ".",
            explanation: "強調のため補語（So complex）を文頭に出し、主語と動詞を倒置させた「So 〜 that ...」の構文です。"
        },
        {
            context: "たとえ彼が謝ったとしても、私は彼を許さないだろう。",
            parts: [
                { fixed: false, target: "Even" },
                { fixed: false, target: "if" },
                { fixed: false, target: "he" },
                { fixed: false, target: "were" },
                { fixed: false, target: "to" },
                { fixed: false, target: "apologize," },
                { fixed: true, target: "I" },
                { fixed: true, target: "would" },
                { fixed: true, target: "not" },
                { fixed: true, target: "forgive" },
                { fixed: true, target: "him" }
            ],
            punctuation: ".",
            explanation: "将来の実現性の低い仮定を表す「If 〜 were to ...（万が一〜なら）」を用いた表現です。"
        },
        {
            context: "彼女はまるで何事もなかったかのように振る舞った。",
            parts: [
                { fixed: false, target: "She" },
                { fixed: false, target: "acted" },
                { fixed: false, target: "as" },
                { fixed: false, target: "if" },
                { fixed: false, target: "nothing" },
                { fixed: false, target: "had" },
                { fixed: true, target: "happened" }
            ],
            punctuation: ".",
            explanation: "「まるで〜であるかのように」を表す as if の後ろには、事実に反する仮定を表す仮定法過去完了（had happened）がきます。"
        },
        {
            context: "彼が成功した主な理由は、努力を惜しまなかったからです。",
            parts: [
                { fixed: false, target: "The" },
                { fixed: false, target: "reason" },
                { fixed: false, target: "why" },
                { fixed: false, target: "he" },
                { fixed: false, target: "succeeded" },
                { fixed: false, target: "was" },
                { fixed: true, target: "that" },
                { fixed: true, target: "he" },
                { fixed: true, target: "worked" },
                { fixed: true, target: "hard" }
            ],
            punctuation: ".",
            explanation: "「The reason why 〜 was that 〜」で「〜の理由は…ということである」という構文を作ります。"
        },
        {
            context: "私たちの誰一人として、その計画に賛成しなかった。",
            parts: [
                { fixed: false, target: "None" },
                { fixed: false, target: "of" },
                { fixed: false, target: "us" },
                { fixed: false, target: "were" },
                { fixed: false, target: "in" },
                { fixed: false, target: "favor" },
                { fixed: true, target: "of" },
                { fixed: true, target: "the" },
                { fixed: true, target: "plan" }
            ],
            punctuation: ".",
            explanation: "None of 〜 で「〜の誰も〜ない」という完全否定を表します。"
        },
        {
            context: "科学技術の発展のおかげで、私たちの生活は楽になった。",
            parts: [
                { fixed: false, target: "Thanks" },
                { fixed: false, target: "to" },
                { fixed: false, target: "the" },
                { fixed: false, target: "advance" },
                { fixed: false, target: "of" },
                { fixed: false, target: "science," },
                { fixed: true, target: "our" },
                { fixed: true, target: "lives" },
                { fixed: true, target: "have" },
                { fixed: true, target: "become" },
                { fixed: true, target: "easier" }
            ],
            punctuation: ".",
            explanation: "「Thanks to 〜」で「〜のおかげで」という理由を表す前置詞句として機能します。"
        },
        {
            context: "この機械を操作するのは、思っていたほど難しくない。",
            parts: [
                { fixed: false, target: "It" },
                { fixed: false, target: "is" },
                { fixed: false, target: "not" },
                { fixed: false, target: "so" },
                { fixed: false, target: "difficult" },
                { fixed: false, target: "as" },
                { fixed: true, target: "I" },
                { fixed: true, target: "had" },
                { fixed: true, target: "expected" }
            ],
            punctuation: ".",
            explanation: "「not so 〜 as 予想（過去完了）」の形で、過去に考えていた程度との比較を表しています。"
        },
        {
            context: "彼らはそのプロジェクトを成功させようと全力を尽くした。",
            parts: [
                { fixed: false, target: "They" },
                { fixed: false, target: "did" },
                { fixed: false, target: "their" },
                { fixed: false, target: "best" },
                { fixed: false, target: "to" },
                { fixed: false, target: "make" },
                { fixed: true, target: "the" },
                { fixed: true, target: "project" },
                { fixed: true, target: "successful" }
            ],
            punctuation: ".",
            explanation: "「do one's best to do」で「〜するために全力を尽くす」を表します。make + O + C の構造も含んでいます。"
        },
        {
            context: "彼女は医者になるために一生懸命勉強した。",
            parts: [
                { fixed: false, target: "She" },
                { fixed: false, target: "studied" },
                { fixed: false, target: "hard" },
                { fixed: false, target: "so" },
                { fixed: false, target: "that" },
                { fixed: false, target: "she" },
                { fixed: true, target: "might" },
                { fixed: true, target: "become" },
                { fixed: true, target: "a" },
                { fixed: true, target: "doctor" }
            ],
            punctuation: ".",
            explanation: "「so that 〜 might ...」で「〜するために（目的）」を表す副詞節を作ります。"
        },
        {
            context: "彼が真実を言っているかどうかは疑わしい。",
            parts: [
                { fixed: false, target: "It" },
                { fixed: false, target: "is" },
                { fixed: false, target: "doubtful" },
                { fixed: false, target: "whether" },
                { fixed: false, target: "he" },
                { fixed: false, target: "is" },
                { fixed: true, target: "telling" },
                { fixed: true, target: "the" },
                { fixed: true, target: "truth" }
            ],
            punctuation: ".",
            explanation: "形式主語 It を使った「It is doubtful whether 〜」で「〜かどうかは疑わしい」を表します。"
        },
        {
            context: "言うまでもなく、健康は富に勝る。",
            parts: [
                { fixed: false, target: "It" },
                { fixed: false, target: "goes" },
                { fixed: false, target: "without" },
                { fixed: false, target: "saying" },
                { fixed: false, target: "that" },
                { fixed: true, target: "health" },
                { fixed: true, target: "is" },
                { fixed: true, target: "above" },
                { fixed: true, target: "wealth" }
            ],
            punctuation: ".",
            explanation: "「It goes without saying that 〜」は「言うまでもないことだが〜」というお決まりの表現です。"
        },
        {
            context: "その知らせを聞いて、彼女は嬉しさのあまり飛び上がった。",
            parts: [
                { fixed: false, target: "Hearing" },
                { fixed: false, target: "the" },
                { fixed: false, target: "news," },
                { fixed: false, target: "she" },
                { fixed: false, target: "jumped" },
                { fixed: true, target: "for" },
                { fixed: true, target: "joy" }
            ],
            punctuation: ".",
            explanation: "分詞構文（Hearing the news）を用いて、「その知らせを聞いて」という付帯状況・理由を表しています。"
        },
        {
            context: "誰もが彼を信頼しているのはもっともだ。",
            parts: [
                { fixed: false, target: "It" },
                { fixed: false, target: "is" },
                { fixed: false, target: "natural" },
                { fixed: false, target: "that" },
                { fixed: false, target: "everyone" },
                { fixed: false, target: "should" },
                { fixed: true, target: "trust" },
                { fixed: true, target: "him" }
            ],
            punctuation: ".",
            explanation: "It is natural that 〜 のような感情・判断を表す形容詞の後ろの that 節では、should がよく使われます。"
        },
        {
            context: "私たちがそこに到着したときには、すでに会議が始まっていた。",
            parts: [
                { fixed: false, target: "By" },
                { fixed: false, target: "the" },
                { fixed: false, target: "time" },
                { fixed: false, target: "we" },
                { fixed: false, target: "got" },
                { fixed: false, target: "there," },
                { fixed: true, target: "the" },
                { fixed: true, target: "meeting" },
                { fixed: true, target: "had" },
                { fixed: true, target: "already" },
                { fixed: true, target: "started" }
            ],
            punctuation: ".",
            explanation: "「By the time 〜（〜する時までには）」の節で過去形（got）を使い、主節側で過去完了（had started）を用いて過去の基準時点より前を表現しています。"
        },
        {
            context: "彼が成功するかどうかは、ひとえに彼の努力にかかっている。",
            parts: [
                { fixed: false, target: "Whether" },
                { fixed: false, target: "he" },
                { fixed: false, target: "will" },
                { fixed: false, target: "succeed" },
                { fixed: false, target: "depends" },
                { fixed: true, target: "entirely" },
                { fixed: true, target: "on" },
                { fixed: true, target: "his" },
                { fixed: true, target: "efforts" }
            ],
            punctuation: ".",
            explanation: "主語の位置に「Whether 節」を置き、「depends entirely on 〜」で「〜に完全にかかっている」と表現しています。"
        }
    ];

    let currentIdx = 0;
    let draggedChip = null;
    let timeLeft = 30;
    let timerInterval = null;
    let isAnswered = false;

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 30;
        isAnswered = false;
        updateTimerDisplay();

        const timerBox = document.getElementById('timerBox');
        timerBox.classList.remove('warning');

        timerInterval = setInterval(() => {
            if (isAnswered) return;
            timeLeft--;
            updateTimerDisplay();

            if (timeLeft <= 0) {
                if (!timerBox.classList.contains('warning')) {
                    timerBox.classList.add('warning');
                }
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const timerText = document.getElementById('timerText');
        timerText.innerText = timeLeft;
    }

    function loadQuestion() {
        const q = questions[currentIdx];
        document.getElementById('progress').innerText = `Question ${currentIdx + 1} of ${questions.length}`;
        document.getElementById('statementText').innerText = q.context;
        document.getElementById('feedback').innerText = '';
        document.getElementById('feedback').className = 'feedback';
        document.getElementById('checkBtn').style.display = 'inline-block';
        document.getElementById('nextBtn').style.display = 'none';
        
        document.getElementById('explanationContainer').classList.add('hidden');
        document.getElementById('reviewCheckbox').checked = false;

        const builder = document.getElementById('sentenceBuilder');
        const wordPool = document.getElementById('wordPool');
        builder.innerHTML = '';
        wordPool.innerHTML = '';

        let blankTargets = q.parts.filter(p => !p.fixed).map(p => p.target);
        let shuffledPool = [...blankTargets].sort(() => Math.random() - 0.5);

        shuffledPool.forEach(targetText => {
            wordPool.appendChild(createChip(targetText));
        });

        q.parts.forEach((part) => {
            if (part.fixed) {
                const fixedEl = document.createElement('div');
                fixedEl.className = 'fixed-word';
                fixedEl.innerText = part.target;
                builder.appendChild(fixedEl);
            } else {
                const slot = document.createElement('div');
                slot.className = 'blank-slot';
                slot.dataset.target = part.target;

                slot.addEventListener('dragover', (e) => {
                    if (isAnswered) return;
                    e.preventDefault();
                    slot.classList.add('drag-over');
                });
                slot.addEventListener('dragleave', () => {
                    slot.classList.remove('drag-over');
                });
                slot.addEventListener('drop', (e) => {
                    if (isAnswered) return;
                    e.preventDefault();
                    slot.classList.remove('drag-over');
                    if (draggedChip) {
                        if (slot.children.length > 0) {
                            wordPool.appendChild(slot.children[0]);
                        }
                        slot.appendChild(draggedChip);
                    }
                });

                builder.appendChild(slot);
            }
        });

        const punct = document.createElement('div');
        punct.className = 'punctuation-mark';
        punct.innerText = q.punctuation;
        builder.appendChild(punct);

        startTimer();
    }

    function createChip(text) {
        const chip = document.createElement('div');
        chip.className = 'word-chip';
        chip.draggable = true;
        chip.innerText = text;

        chip.addEventListener('dragstart', () => {
            if (isAnswered) return;
            draggedChip = chip;
            setTimeout(() => chip.classList.add('dragging'), 0);
        });
        chip.addEventListener('dragend', () => {
            draggedChip = null;
        });

        chip.addEventListener('touchstart', (e) => {
            if (isAnswered) return;
            draggedChip = chip;
            chip.classList.add('dragging');
        }, {passive: true});

        chip.addEventListener('touchend', (e) => {
            if (isAnswered) return;
            chip.classList.remove('dragging');
            
            const touch = e.changedTouches[0];
            const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);
            
            if (targetElement) {
                const slot = targetElement.closest('.blank-slot');
                const pool = targetElement.closest('.word-pool');
                
                if (slot) {
                    if (slot.children.length > 0) {
                        document.getElementById('wordPool').appendChild(slot.children[0]);
                    }
                    slot.appendChild(chip);
                } else if (pool) {
                    pool.appendChild(chip);
                }
            }
            draggedChip = null;
        });

        return chip;
    }

    function allowDrop(e) {
        if (isAnswered) return;
        e.preventDefault();
        e.currentTarget.style.background = '#f1f5f9';
    }

    function removePoolStyle(e) {
        e.currentTarget.style.background = '#f8fafc';
    }

    function dropToPool(e) {
        if (isAnswered) return;
        e.preventDefault();
        document.getElementById('wordPool').style.background = '#f8fafc';
        if (draggedChip) {
            document.getElementById('wordPool').appendChild(draggedChip);
        }
    }

    function checkAnswer() {
        if (isAnswered) return;
        
        const builder = document.getElementById('sentenceBuilder');
        const slots = builder.querySelectorAll('.blank-slot');
        const feedback = document.getElementById('feedback');

        let allFilled = true;
        let isCorrect = true;

        slots.forEach(slot => {
            if (slot.children.length === 0) {
                allFilled = false;
            } else {
                const userText = slot.children[0].innerText.trim();
                const correctText = slot.dataset.target.trim();
                if (userText.toLowerCase() !== correctText.toLowerCase()) {
                    isCorrect = false;
                }
            }
        });

        if (!allFilled) {
            feedback.innerText = "すべての空欄に単語を置いてください。";
            feedback.className = "feedback incorrect";
            return;
        }

        if (isCorrect) {
            isAnswered = true;
            clearInterval(timerInterval);
            feedback.innerText = "正解です！素晴らしい！";
            feedback.className = "feedback correct";
            document.getElementById('checkBtn').style.display = 'none';
            if (currentIdx < questions.length - 1) {
                document.getElementById('nextBtn').style.display = 'inline-block';
                document.getElementById('nextBtn').disabled = false;
            }
        } else {
            isAnswered = true;
            clearInterval(timerInterval);
            feedback.innerText = "不正解です。以下の正しい文と文法解説を確認してください。";
            feedback.className = "feedback incorrect";
            document.getElementById('checkBtn').style.display = 'none';
            
            const q = questions[currentIdx];
            let fullSentence = q.parts.map(p => p.target).join(" ") + q.punctuation;
            
            const explanationText = document.getElementById('explanationText');
            explanationText.innerHTML = `
                <strong>Correct Sentence:</strong> ${fullSentence}<br>
                <div style="margin-top: 8px; font-weight: normal; color: #166534; line-height: 1.5;">
                    <strong>文法解説:</strong> ${q.explanation}
                </div>
            `;
            document.getElementById('explanationContainer').classList.remove('hidden');
            
            if (currentIdx < questions.length - 1) {
                document.getElementById('nextBtn').style.display = 'inline-block';
                document.getElementById('nextBtn').disabled = true;
            }
        }
    }

    function toggleReview() {
        const checkbox = document.getElementById('reviewCheckbox');
        const nextBtn = document.getElementById('nextBtn');
        if (checkbox.checked) {
            nextBtn.disabled = false;
        } else {
            nextBtn.disabled = true;
        }
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
            loadQuestion();
        } else {
            document.getElementById('progress').innerText = "Complete!";
            document.getElementById('statementText').innerText = "おめでとうございます！英検2級レベル全30問をすべてクリアしました！";
            document.getElementById('sentenceBuilder').innerHTML = "";
            document.getElementById('wordPool').innerHTML = "";
            document.getElementById('timerBox').style.display = "none";
            document.getElementById('checkBtn').style.display = "none";
            document.getElementById('nextBtn').style.display = "none";
            document.getElementById('explanationContainer').classList.add('hidden');
        }
    }

    loadQuestion();
</script>
