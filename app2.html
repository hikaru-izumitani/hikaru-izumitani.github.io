<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEFL iBT - Build a Sentence Practice (100 Questions)</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --border-color: #cbd5e1;
            --success: #16a34a;
            --error: #dc2626;
            --warning: #d97706;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 1.25rem;
            margin: 0;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .timer-box {
            font-size: 1.1rem;
            font-weight: bold;
            background: #f1f5f9;
            padding: 6px 14px;
            border-radius: 20px;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--border-color);
            transition: all 0.3s;
        }

        .timer-box.warning {
            background: #fef2f2;
            color: var(--error);
            border-color: #fca5a5;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .instructions {
            font-size: 0.95rem;
            color: #64748b;
            margin-bottom: 15px;
        }

        .progress {
            font-size: 0.85rem;
            font-weight: bold;
            color: #64748b;
            margin-bottom: 15px;
        }

        .prompt-box {
            background: #f1f5f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .statement {
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 1.05rem;
        }

        .sentence-builder {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 64px;
            padding: 12px;
            background: #ffffff;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            align-items: center;
            margin-bottom: 15px;
        }

        .fixed-word {
            background: #e2e8f0;
            border: 1px solid #cbd5e1;
            color: #475569;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.95rem;
            font-weight: 500;
            user-select: none;
        }

        .blank-slot {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 60px;
            min-height: 40px;
            padding: 4px 8px;
            background: #f8fafc;
            border: 2px dashed #94a3b8;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .blank-slot.drag-over {
            background: #dbeafe;
            border-color: var(--primary);
        }

        .word-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 54px;
            padding: 12px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            align-items: center;
        }

        .word-pool-label {
            font-size: 0.8rem;
            color: #64748b;
            margin-bottom: 5px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .word-chip {
            background: #ffffff;
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: grab;
            font-size: 0.95rem;
            user-select: none;
            touch-action: none;
            transition: all 0.2s ease;
        }

        .word-chip:active {
            cursor: grabbing;
        }

        .word-chip.dragging {
            opacity: 0.4;
        }

        .punctuation-mark {
            font-weight: bold;
            font-size: 1.1rem;
            margin-left: 4px;
            color: #334155;
            align-self: flex-end;
            padding-bottom: 8px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 25px;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
        }

        .feedback {
            margin-top: 15px;
            font-weight: bold;
            font-size: 0.95rem;
            min-height: 24px;
        }

        .feedback.correct {
            color: var(--success);
        }

        .feedback.incorrect {
            color: var(--error);
        }

        .explanation-box {
            margin-top: 15px;
            padding: 15px;
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 8px;
            color: #92400e;
        }

        .review-label {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            font-size: 0.9rem;
            font-weight: normal;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-row">
        <h1>Build a Sentence</h1>
        <div class="timer-box" id="timerBox">
            ⏱️ <span id="timerText">40</span>s
        </div>
    </div>
    <div class="instructions">Move the words into the blanks to create grammatical sentences. If incorrect, review the correct answer and grammar note before proceeding.</div>
    
    <div class="progress" id="progress">Question 1 of 100</div>
    
    <div class="prompt-box">
        <div class="statement" id="statementText">Loading...</div>
        
        <div class="sentence-builder" id="sentenceBuilder"></div>
        
        <div class="word-pool-label">Word Bank (Drag / Tap & Drop)</div>
        <div class="word-pool" id="wordPool" ondragover="allowDrop(event)" ondragleave="removePoolStyle(event)" ondrop="dropToPool(event)"></div>
    </div>

    <!-- 解説・レビューエリア -->
    <div id="explanationContainer" class="explanation-box hidden">
        <div id="explanationText"></div>
        <label class="review-label">
            <input type="checkbox" id="reviewCheckbox" onchange="toggleReview()"> 正しい答えと文法解説を確認しました (Review Completed)
        </label>
    </div>

    <div class="controls">
        <button id="checkBtn" onclick="checkAnswer()">Check Answer</button>
        <button id="nextBtn" onclick="nextQuestion()" style="display: none;" disabled>Next Question</button>
    </div>

    <div class="feedback" id="feedback"></div>
</div>

<script>
    const questions = [
        // 1-10
        {
            context: "I need to buy a new laptop.",
            parts: [
                { fixed: false, target: "Which" },
                { fixed: false, target: "store" },
                { fixed: false, target: "has" },
                { fixed: false, target: "the" },
                { fixed: false, target: "best" },
                { fixed: false, target: "deals" }
            ],
            punctuation: "?",
            explanation: "疑問詞 which に名詞（store）が直結して「どの〜が」という主語のかたまりを作り、そのあとに動詞（has）が続く基本の疑問文の語順です。"
        },
        {
            context: "I'm thinking about starting a blog.",
            parts: [
                { fixed: false, target: "Have" },
                { fixed: false, target: "you" },
                { fixed: false, target: "decided" },
                { fixed: false, target: "on" },
                { fixed: false, target: "a" },
                { fixed: false, target: "topic" },
                { fixed: false, target: "yet" }
            ],
            punctuation: "?",
            explanation: "現在完了形（Have + 主語 + 過去分詞）を用いた経験や完了を尋ねる疑問文。文末の yet は疑問文で「もう」という意味を表します。"
        },
        {
            context: "I'm going to study at the library this afternoon.",
            parts: [
                { fixed: false, target: "Do" },
                { fixed: false, target: "you" },
                { fixed: false, target: "need" },
                { fixed: false, target: "to" },
                { fixed: false, target: "borrow" },
                { fixed: false, target: "any" },
                { fixed: false, target: "books" }
            ],
            punctuation: "?",
            explanation: "「〜する必要がある」を表す need to の疑問文。肯定文の some が、疑問文や否定文では any に変化するルールが使われています。"
        },
        {
            context: "I'm thinking about getting a pet.",
            parts: [
                { fixed: false, target: "What" },
                { fixed: false, target: "kind" },
                { fixed: false, target: "of" },
                { fixed: false, target: "animal" },
                { fixed: false, target: "are" },
                { fixed: false, target: "you" },
                { fixed: false, target: "considering" }
            ],
            punctuation: "?",
            explanation: "「どんな種類の〜」を尋ねる What kind of に名詞が続き、be動詞の疑問文（be + 主語 + -ing）の語順に綺麗に繋がる構文です。"
        },
        {
            context: "I'm excited to see the new science fiction movie tonight.",
            parts: [
                { fixed: false, target: "Where" },
                { fixed: false, target: "is" },
                { fixed: false, target: "it" },
                { fixed: false, target: "showing" }
            ],
            punctuation: "?",
            explanation: "場所を尋ねる Where に be動詞の疑問文（Where + is + 主語 + 現在分詞）が続く、上映場所を確認するシンプルな表現です。"
        },
        {
            context: "I have an interview for a new job next week.",
            parts: [
                { fixed: false, target: "Do" },
                { fixed: false, target: "you" },
                { fixed: false, target: "have" },
                { fixed: false, target: "your" },
                { fixed: false, target: "resume" },
                { fixed: false, target: "ready" }
            ],
            punctuation: "?",
            explanation: "「Oを〜の状態にしておく」という第5文型（have + O + 形容詞）の構造。resume（履歴書）を ready（準備できた状態）にするか尋ねています。"
        },
        {
            context: "I need to submit my assignment by tomorrow.",
            parts: [
                { fixed: false, target: "Have" },
                { fixed: false, target: "you" },
                { fixed: false, target: "finished" },
                { fixed: false, target: "writing" },
                { fixed: false, target: "it" }
            ],
            punctuation: "?",
            explanation: "finish の後には動名詞（writing）が目的語として来るという動詞の性質と、現在完了の疑問文の組み合わせです。"
        },
        {
            context: "I'm planning a trip to Europe this summer.",
            parts: [
                { fixed: false, target: "Did" },
                { fixed: false, target: "you" },
                { fixed: true, target: "book your" },
                { fixed: false, target: "flight" },
                { fixed: false, target: "yet" }
            ],
            punctuation: "?",
            explanation: "過去の動作の完了を尋ねる Did you ＋ 動詞の原形 の疑問文。固定語句（book your）を挟んでスムーズに文を完成させます。"
        },
        {
            context: "I just started learning French.",
            parts: [
                { fixed: false, target: "Where" },
                { fixed: false, target: "are" },
                { fixed: false, target: "you" },
                { fixed: false, target: "taking" },
                { fixed: false, target: "classes" }
            ],
            punctuation: "?",
            explanation: "現在進行形を用いた学習場所の尋ね方。take classes（授業を受ける）という自然なコロケーションが使われています。"
        },
        {
            context: "Why are you asking about the project deadline?",
            parts: [
                { fixed: true, target: "I’m" },
                { fixed: false, target: "checking" },
                { fixed: false, target: "to" },
                { fixed: false, target: "see" },
                { fixed: false, target: "if" },
                { fixed: false, target: "it" },
                { fixed: false, target: "has been" },
                { fixed: false, target: "extended" }
            ],
            punctuation: ".",
            explanation: "不定詞の副詞的用法（〜するために確認する）と、間接疑問の代わりになる if 節（〜かどうか）、さらに受動態の現在完了（has been extended）が詰まった重要構文です。"
        },
        // 11-30
        {
            context: "I am feeling a bit tired today.",
            parts: [
                { fixed: false, target: "Why" },
                { fixed: false, target: "don't" },
                { fixed: false, target: "you" },
                { fixed: false, target: "take" },
                { fixed: false, target: "a" },
                { fixed: false, target: "short" },
                { fixed: false, target: "nap" }
            ],
            punctuation: "?",
            explanation: "「〜したらどうですか？」と提案をする定番表現 Why don't you + 動詞の原形。take a nap（仮眠をとる）の形をとります。"
        },
        {
            context: "The conference room is fully booked for the morning.",
            parts: [
                { fixed: false, target: "Can" },
                { fixed: false, target: "we" },
                { fixed: false, target: "reschedule" },
                { fixed: false, target: "the" },
                { fixed: false, target: "meeting" },
                { fixed: false, target: "to" },
                { fixed: false, target: "the" },
                { fixed: false, target: "afternoon" }
            ],
            punctuation: "?",
            explanation: "変更先を指す前置詞 to を伴い、reschedule A to B（AをBに日程変更する）の語順を作るビジネス英語の必須表現です。"
        },
        {
            context: "I am having trouble connecting to the office Wi-Fi.",
            parts: [
                { fixed: false, target: "Could" },
                { fixed: false, target: "you" },
                { fixed: false, target: "help" },
                { fixed: false, target: "me" },
                { fixed: false, target: "troubleshoot" },
                { fixed: false, target: "the" },
                { fixed: false, target: "network" }
            ],
            punctuation: "?",
            explanation: "丁寧な依頼を表す Could you に続き、help + 目的語 + 原形不定詞（troubleshoot）の形をとる実用的なヘルプ要請文です。"
        },
        {
            context: "I am looking for a quiet place to read.",
            parts: [
                { fixed: false, target: "Do" },
                { fixed: false, target: "you" },
                { fixed: false, target: "know" },
                { fixed: false, target: "any" },
                { fixed: false, target: "good" },
                { fixed: false, target: "spots" },
                { fixed: false, target: "nearby" }
            ],
            punctuation: "?",
            explanation: "情報を求める一般疑問文。spots nearby（近くのスポット）のように、形容詞が後ろから名詞を修飾する配置に注意が必要です。"
        },
        {
            context: "We need to finish this report by Friday.",
            parts: [
                { fixed: false, target: "Let" },
                { fixed: false, target: "us" },
                { fixed: false, target: "divide" },
                { fixed: false, target: "the" },
                { fixed: false, target: "tasks" },
                { fixed: false, target: "equally" }
            ],
            punctuation: ".",
            explanation: "「〜しよう」と促す Let's（Let us）に動詞の原形が続き、副詞（equally: 平等に）が動詞や目的語の塊を後ろから修飾する文構造です。"
        },
        {
            context: "I am planning to upgrade my smartphone soon.",
            parts: [
                { fixed: false, target: "Which" },
                { fixed: false, target: "brand" },
                { fixed: false, target: "do" },
                { fixed: false, target: "you" },
                { fixed: false, target: "recommend" }
            ],
            punctuation: "?",
            explanation: "Which brand が疑問詞のひと固まりとなり、そのあとに通常の疑問文（do you recommend）が続く構造です。"
        },
        {
            context: "The weather forecast says it will rain heavily tomorrow.",
            parts: [
                { fixed: false, target: "We" },
                { fixed: false, target: "should" },
                { fixed: false, target: "cancel" },
                { fixed: false, target: "the" },
                { fixed: false, target: "outdoor" },
                { fixed: false, target: "event" }
            ],
            punctuation: ".",
            explanation: "助動詞 should（〜すべきだ）を用いて、状況に対する論理的な対策・提案を述べる明快な文です。"
        },
        {
            context: "I forgot my umbrella at home.",
            parts: [
                { fixed: false, target: "Do" },
                { fixed: false, target: "you" },
                { fixed: false, target: "happen" },
                { fixed: false, target: "to" },
                { fixed: false, target: "have" },
                { fixed: false, target: "a" },
                { fixed: false, target: "spare" },
                { fixed: false, target: "one" }
            ],
            punctuation: "?",
            explanation: "「もしかして〜ですか？」と控えめに尋ねる便利な表現 Do you happen to... の語順を問う問題です。"
        },
        {
            context: "I am interested in joining the photography club.",
            parts: [
                { fixed: false, target: "How" },
                { fixed: false, target: "can" },
                { fixed: false, target: "I" },
                { fixed: false, target: "sign" },
                { fixed: false, target: "up" },
                { fixed: false, target: "for" },
                { fixed: false, target: "membership" }
            ],
            punctuation: "?",
            explanation: "「申し込む」を意味する句動詞 sign up for と、手段を尋ねる疑問詞 How が組み合わさった日常・キャンパス英語です。"
        },
        {
            context: "The printer is out of paper again.",
            parts: [
                { fixed: false, target: "I" },
                { fixed: false, target: "will" },
                { fixed: false, target: "refill" },
                { fixed: false, target: "the" },
                { fixed: false, target: "tray" },
                { fixed: false, target: "right" },
                { fixed: false, target: "now" }
            ],
            punctuation: ".",
            explanation: "「今すぐ〜する」というその場の意志を表す will と、refill the tray（トレイを補充する）の組み合わせです。"
        },
        {
            context: "I am trying to improve my presentation skills.",
            parts: [
                { fixed: false, target: "Would" },
                { fixed: false, target: "you" },
                { fixed: false, target: "mind" },
                { fixed: false, target: "listening" },
                { fixed: false, target: "to" },
                { fixed: false, target: "my" },
                { fixed: false, target: "practice" },
                { fixed: false, target: "speech" }
            ],
            punctuation: "?",
            explanation: "Would you mind の後ろには必ず動名詞（listening）が来るという重要な文法ルールを伴う、協力を仰ぐための洗練された表現です。"
        },
        {
            context: "We are running low on coffee in the breakroom.",
            parts: [
                { fixed: false, target: "Who" },
                { fixed: false, target: "is" },
                { fixed: false, target: "responsible" },
                { fixed: false, target: "for" },
                { fixed: false, target: "buying" },
                { fixed: false, target: "supplies" }
            ],
            punctuation: "?",
            explanation: "「〜の責任がある」を表す be responsible for の後ろに動名詞（buying）が続くパターン。Who が主語になる疑問文です。"
        },
        {
            context: "I am looking for the marketing department office.",
            parts: [
                { fixed: false, target: "Could" },
                { fixed: false, target: "you" },
                { fixed: false, target: "point" },
                { fixed: false, target: "me" },
                { fixed: false, target: "in" },
                { fixed: false, target: "the" },
                { fixed: false, target: "right" },
                { fixed: false, target: "direction" }
            ],
            punctuation: "?",
            explanation: "point 人 in the right direction（人を正しい方向に導く／案内する）という決まり文句の語順構成です。"
        },
        {
            context: "The train schedule changed due to maintenance work.",
            parts: [
                { fixed: false, target: "Make" },
                { fixed: false, target: "sure" },
                { fixed: false, target: "to" },
                { fixed: false, target: "check" },
                { fixed: false, target: "the" },
                { fixed: false, target: "latest" },
                { fixed: false, target: "timetable" }
            ],
            punctuation: ".",
            explanation: "「確実に〜しなさい」と指示を出す Make sure to + 動詞の原形 の命令文の形です。"
        },
        {
            context: "I want to register for the advanced data science course.",
            parts: [
                { fixed: false, target: "What" },
                { fixed: false, target: "are" },
                { fixed: false, target: "the" },
                { fixed: false, target: "prerequisite" },
                { fixed: false, target: "requirements" }
            ],
            punctuation: "?",
            explanation: "複数の要件（requirements）を尋ねるため、be動詞が are になり、主語が複数形になっている点に注目した疑問文です。"
        },
        {
            context: "The museum exhibition closes at five o'clock.",
            parts: [
                { fixed: false, target: "We" },
                { fixed: false, target: "need" },
                { fixed: false, target: "to" },
                { fixed: false, target: "leave" },
                { fixed: false, target: "soon" },
                { fixed: false, target: "to" },
                { fixed: false, target: "get" },
                { fixed: false, target: "there" },
                { fixed: false, target: "on" },
                { fixed: false, target: "time" },
            ],
            punctuation: ".",
            explanation: "前半の need to leave soon と、目的を表す不定詞 to get there on time（そこに時間通りに着くために）がつながる長めの文です。"
        },
        {
            context: "I am planning to host a dinner party this weekend.",
            parts: [
                { fixed: false, target: "Would" },
                { fixed: false, target: "you" },
                { fixed: false, target: "like" },
                { fixed: false, target: "to" },
                { fixed: false, target: "come" },
                { fixed: false, target: "over" },
                { fixed: false, target: "as" },
                { fixed: false, target: "well" }
            ],
            punctuation: "?",
            explanation: "相手を誘う定番表現 Would you like to... に、come over（遊びに来る）や文末の as well（〜もまた）が調和した自然な会話文です。"
        },
        {

    let currentIdx = 0;
    let draggedChip = null;
    let timeLeft = 40;
    let timerInterval = null;
    let isAnswered = false;

    function startTimer() {
        clearInterval(timerInterval);
        timeLeft = 40;
        isAnswered = false;
        updateTimerDisplay();

        const timerBox = document.getElementById('timerBox');
        timerBox.classList.remove('warning');

        timerInterval = setInterval(() => {
            if (isAnswered) return;
            timeLeft--;
            updateTimerDisplay();

            if (timeLeft <= 0) {
                if (!timerBox.classList.contains('warning')) {
                    timerBox.classList.add('warning');
                }
            }
        }, 1000);
    }

    function updateTimerDisplay() {
        const timerText = document.getElementById('timerText');
        timerText.innerText = timeLeft;
    }

    function loadQuestion() {
        const q = questions[currentIdx];
        document.getElementById('progress').innerText = `Question ${currentIdx + 1} of ${questions.length}`;
        document.getElementById('statementText').innerText = q.context;
        document.getElementById('feedback').innerText = '';
        document.getElementById('feedback').className = 'feedback';
        document.getElementById('checkBtn').style.display = 'inline-block';
        document.getElementById('nextBtn').style.display = 'none';
        
        document.getElementById('explanationContainer').classList.add('hidden');
        document.getElementById('reviewCheckbox').checked = false;

        const builder = document.getElementById('sentenceBuilder');
        const wordPool = document.getElementById('wordPool');
        builder.innerHTML = '';
        wordPool.innerHTML = '';

        let blankTargets = q.parts.filter(p => !p.fixed).map(p => p.target);
        let shuffledPool = [...blankTargets].sort(() => Math.random() - 0.5);

        shuffledPool.forEach(targetText => {
            wordPool.appendChild(createChip(targetText));
        });

        q.parts.forEach((part) => {
            if (part.fixed) {
                const fixedEl = document.createElement('div');
                fixedEl.className = 'fixed-word';
                fixedEl.innerText = part.target;
                builder.appendChild(fixedEl);
            } else {
                const slot = document.createElement('div');
                slot.className = 'blank-slot';
                slot.dataset.target = part.target;

                slot.addEventListener('dragover', (e) => {
                    if (isAnswered) return;
                    e.preventDefault();
                    slot.classList.add('drag-over');
                });
                slot.addEventListener('dragleave', () => {
                    slot.classList.remove('drag-over');
                });
                slot.addEventListener('drop', (e) => {
                    if (isAnswered) return;
                    e.preventDefault();
                    slot.classList.remove('drag-over');
                    if (draggedChip) {
                        if (slot.children.length > 0) {
                            wordPool.appendChild(slot.children[0]);
                        }
                        slot.appendChild(draggedChip);
                    }
                });

                builder.appendChild(slot);
            }
        });

        const punct = document.createElement('div');
        punct.className = 'punctuation-mark';
        punct.innerText = q.punctuation;
        builder.appendChild(punct);

        startTimer();
    }

    function createChip(text) {
        const chip = document.createElement('div');
        chip.className = 'word-chip';
        chip.draggable = true;
        chip.innerText = text;

        // デスクトップ用 ドラッグイベント
        chip.addEventListener('dragstart', () => {
            if (isAnswered) return;
            draggedChip = chip;
            setTimeout(() => chip.classList.add('dragging'), 0);
        });
        chip.addEventListener('dragend', () => {
            draggedChip = null;
        });

        // スマホ・タブレット用 タッチイベント（簡易対応）
        chip.addEventListener('touchstart', (e) => {
            if (isAnswered) return;
            draggedChip = chip;
            chip.classList.add('dragging');
        }, {passive: true});

        chip.addEventListener('touchend', (e) => {
            if (isAnswered) return;
            chip.classList.remove('dragging');
            
            // タッチ終了時の位置にある要素を判定してドロップ処理を行う
            const touch = e.changedTouches[0];
            const targetElement = document.elementFromPoint(touch.clientX, touch.clientY);
            
            if (targetElement) {
                const slot = targetElement.closest('.blank-slot');
                const pool = targetElement.closest('.word-pool');
                
                if (slot) {
                    if (slot.children.length > 0) {
                        document.getElementById('wordPool').appendChild(slot.children[0]);
                    }
                    slot.appendChild(chip);
                } else if (pool) {
                    pool.appendChild(chip);
                }
            }
            draggedChip = null;
        });

        return chip;
    }

    function allowDrop(e) {
        if (isAnswered) return;
        e.preventDefault();
        e.currentTarget.style.background = '#f1f5f9';
    }

    function removePoolStyle(e) {
        e.currentTarget.style.background = '#f8fafc';
    }

    function dropToPool(e) {
        if (isAnswered) return;
        e.preventDefault();
        document.getElementById('wordPool').style.background = '#f8fafc';
        if (draggedChip) {
            document.getElementById('wordPool').appendChild(draggedChip);
        }
    }

    function checkAnswer() {
        if (isAnswered) return;
        
        const builder = document.getElementById('sentenceBuilder');
        const slots = builder.querySelectorAll('.blank-slot');
        const feedback = document.getElementById('feedback');

        let allFilled = true;
        let isCorrect = true;

        slots.forEach(slot => {
            if (slot.children.length === 0) {
                allFilled = false;
            } else {
                const userText = slot.children[0].innerText.trim();
                const correctText = slot.dataset.target.trim();
                if (userText.toLowerCase() !== correctText.toLowerCase()) {
                    isCorrect = false;
                }
            }
        });

        if (!allFilled) {
            feedback.innerText = "Please fill in all the blank slots.";
            feedback.className = "feedback incorrect";
            return;
        }

        if (isCorrect) {
            isAnswered = true;
            clearInterval(timerInterval);
            feedback.innerText = "Correct! Great job.";
            feedback.className = "feedback correct";
            document.getElementById('checkBtn').style.display = 'none';
            if (currentIdx < questions.length - 1) {
                document.getElementById('nextBtn').style.display = 'inline-block';
                document.getElementById('nextBtn').disabled = false;
            }
        } else {
            isAnswered = true;
            clearInterval(timerInterval);
            feedback.innerText = "Incorrect order. Please review the correct answer and grammar note below.";
            feedback.className = "feedback incorrect";
            document.getElementById('checkBtn').style.display = 'none';
            
            const q = questions[currentIdx];
            let fullSentence = q.parts.map(p => p.target).join(" ") + q.punctuation;
            
            const explanationText = document.getElementById('explanationText');
            explanationText.innerHTML = `
                <strong>Correct Sentence:</strong> ${fullSentence}<br>
                <div style="margin-top: 8px; font-weight: normal; color: #78350f; line-height: 1.5;">
                    <strong>Grammar Note:</strong> ${q.explanation}
                </div>
            `;
            document.getElementById('explanationContainer').classList.remove('hidden');
            
            if (currentIdx < questions.length - 1) {
                document.getElementById('nextBtn').style.display = 'inline-block';
                document.getElementById('nextBtn').disabled = true;
            }
        }
    }

    function toggleReview() {
        const checkbox = document.getElementById('reviewCheckbox');
        const nextBtn = document.getElementById('nextBtn');
        if (checkbox.checked) {
            nextBtn.disabled = false;
        } else {
            nextBtn.disabled = true;
        }
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < questions.length) {
            loadQuestion();
        } else {
            document.getElementById('progress').innerText = "Complete!";
            document.getElementById('statementText').innerText = "Congratulations! You have finished all 100 questions.";
            document.getElementById('sentenceBuilder').innerHTML = "";
            document.getElementById('wordPool').innerHTML = "";
            document.getElementById('timerBox').style.display = "none";
            document.getElementById('checkBtn').style.display = "none";
            document.getElementById('nextBtn').style.display = "none";
            document.getElementById('explanationContainer').classList.add('hidden');
        }
    }

    loadQuestion();
</script>

</body>
</html>
